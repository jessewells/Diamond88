<html lang="en">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}[hidden]{display:none!important}</style>
<title>Diamond '88</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one column — the game screen in a console bezel, a context hint, then a two-handed controller deck under the thumbs. */
:root{
  --bezel:#16141d;      /* console body */
  --deck:#25222e;       /* controller plate */
  --deck-hi:#34303f;
  --ink:#ece6d6;        /* printed labels */
  --dim:#8e879d;
  --btn:#c9372c;        /* A/B */
  --btn-hi:#e8574a;
  --pad:#0f0e14;        /* d-pad plastic */
  --glass:#07070b;
  --f-display:"Press Start 2P", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bezel);color:var(--ink);font-family:var(--f-display);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.app{box-sizing:border-box;height:100%;max-width:560px;margin:0 auto;padding-inline:16px;padding-block:10px 14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.cab{position:relative;background:var(--glass);padding:6px;border-radius:6px;box-shadow:inset 0 0 0 2px #000, 0 0 0 3px var(--deck-hi);
  width:min(100%, calc((100dvh - 290px) * 256 / 240 + 12px));max-width:100%;box-sizing:border-box}
.cab::after{content:"";position:absolute;inset:6px;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.09) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 22px rgba(0,0,0,.5)}
#screen{display:block;width:100%;aspect-ratio:256/240;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
.keys{display:none;flex-wrap:wrap;justify-content:center;gap:8px 18px;font-size:9px;color:var(--dim);letter-spacing:.04em;max-width:100%}
.keys span{display:flex;align-items:center;gap:4px;white-space:nowrap}
kbd{font:inherit;font-size:9px;color:var(--ink);background:var(--deck);border-radius:4px;padding:3px 5px;box-shadow:inset 0 -2px 0 #0b0a10,0 0 0 1px var(--deck-hi)}
@media (hover:hover) and (pointer:fine){
  .app{max-width:960px}
  .app .deck{display:none}
  .keys{display:flex}
  .cab{width:min(100%, calc((100dvh - 150px) * 256 / 240 + 12px))}
}
.hint{margin:0;min-height:2.6em;font-size:9px;line-height:1.45;color:var(--dim);text-align:center;letter-spacing:.04em;max-width:40ch;text-wrap:balance}
.deck{width:100%;flex:1 1 auto;min-height:200px;max-height:300px;background:var(--deck);border-radius:14px 14px 28px 28px;
  box-shadow:inset 0 2px 0 var(--deck-hi), 0 4px 0 #0b0a10;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding-inline:14px;padding-block:12px;box-sizing:border-box;gap:8px}
.dpad{position:relative;width:min(40vw,148px);aspect-ratio:1;justify-self:start;touch-action:none}
.dpad i{position:absolute;background:var(--pad);border-radius:4px;box-shadow:0 3px 0 #000}
.dpad .h{left:0;right:0;top:33.3%;height:33.4%}
.dpad .v{top:0;bottom:0;left:33.3%;width:33.4%}
.dpad .dot{left:41%;top:41%;width:18%;height:18%;border-radius:50%;background:#1d1b25;box-shadow:none}
.dpad b{position:absolute;color:#3a3646;font-size:10px;font-weight:400}
.dpad b.u{top:6%;left:50%;transform:translateX(-50%)}
.dpad b.d{bottom:6%;left:50%;transform:translateX(-50%)}
.dpad b.l{left:6%;top:50%;transform:translateY(-50%)}
.dpad b.r{right:6%;top:50%;transform:translateY(-50%)}
.dpad[data-dir~="u"] .v,.dpad[data-dir~="d"] .v,.dpad[data-dir~="l"] .h,.dpad[data-dir~="r"] .h{background:#1c1a24}
.mid{display:flex;flex-direction:column;gap:12px;align-items:center}
.pill{font:inherit;font-size:7px;letter-spacing:.12em;color:var(--dim);background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;touch-action:none}
.pill span{display:block;width:44px;height:12px;border-radius:6px;background:#121018;box-shadow:inset 0 0 0 2px #0a090e}
.pill.on span{background:#2b2733}
.pill em{font-style:normal}
.pill.lit span{background:#2f7a3d;box-shadow:inset 0 0 0 2px #0a090e,0 0 8px rgba(95,208,106,.45)}
.ab{justify-self:end;display:flex;gap:14px;align-items:flex-end;transform:rotate(-14deg)}
.ab button{font:inherit;width:min(17vw,66px);aspect-ratio:1;border-radius:50%;border:0;background:var(--btn);color:#fff3ec;font-size:13px;
  box-shadow:0 4px 0 #6f1a14, inset 0 2px 0 var(--btn-hi);touch-action:none;display:grid;place-items:center}
.ab .a{margin-bottom:22px}
.ab button.on{transform:translateY(3px);box-shadow:0 1px 0 #6f1a14, inset 0 2px 0 var(--btn-hi)}
.ab button:focus-visible,.pill:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (min-height:880px){.deck{max-height:320px}}
@media (prefers-reduced-motion:reduce){.ab button.on{transform:none}}
</style>

</head>
<body>
<main class="app">
  <div class="cab"><canvas id="screen" width="512" height="480" aria-label="Diamond '88 game screen"></canvas></div>
  <p class="hint" id="hint" aria-live="polite"></p>
  <div class="keys" aria-label="Keyboard controls">
    <span><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</span>
    <span><kbd>X</kbd> or <kbd>Space</kbd> A: swing, pitch, run</span>
    <span><kbd>Z</kbd> B: bunt, hold</span>
    <span><kbd>Enter</kbd> start/pause</span>
    <span><kbd>M</kbd> sound</span>
    <span>Gamepads work too</span>
  </div>
  <div class="deck">
    <div class="dpad" id="dpad" aria-label="Direction pad">
      <i class="h"></i><i class="v"></i><i class="dot"></i>
      <b class="u">▲</b><b class="d">▼</b><b class="l">◀</b><b class="r">▶</b>
    </div>
    <div class="mid">
      <button class="pill lit" data-k="select" id="k-select" aria-label="Sound on or off" aria-pressed="true"><span></span><em id="snd">SOUND ON</em></button>
      <button class="pill" data-k="start" id="k-start" aria-label="Start or pause"><span></span>START</button>
    </div>
    <div class="ab">
      <button class="b" data-k="b" id="k-b" aria-label="B button">B</button>
      <button class="a" data-k="a" id="k-a" aria-label="A button">A</button>
    </div>
  </div>
</main>

<script>
'use strict';
const W=256,H=240,DT=1/60,KD=0.0012,ROLL=30;
const cv=document.getElementById('screen'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const gauss=()=>{let u=0;for(let i=0;i<4;i++)u+=Math.random();return (u-2)/0.577;};
const hyp=Math.hypot;
const C={grass:'#3f8f3c',grass2:'#378436',dirt:'#c2834c',dirt2:'#ad713e',line:'#f3efe4',stands:'#221d2c',wall:'#1d4a37',
  yellow:'#f4c84a',hud:'#0c0b12',text:'#f3efe4',dim:'#9c95ac',red:'#e2483b',green:'#5fd06a',ball:'#ffffff',shadow:'rgba(0,0,0,.35)'};
const SKINS=['#efc29a','#d39a6a','#a96c43','#7a4a2c'];

/* ---------------- teams ---------------- */
const TEAMS=[
 {name:'NORMAN PINES',abbr:'NOR',jersey:'#2f8f4e',pants:'#f2efe4',cap:'#174d2b',
  pitcher:{name:'HOLLIS',velo:.8,ctrl:.72},
  lineup:[['BRANSON','L',.3,.86,.95],['OKADA','R',.45,.8,.7],['DELACRUZ','R',.85,.66,.45],['WELLS','L',.95,.6,.4],
   ['MARSH','R',.7,.65,.5],['TATUM','R',.55,.7,.6],['IBARRA','L',.4,.72,.65],['KOWALSKI','R',.35,.62,.4],['FINCH','R',.2,.7,.8]]},
 {name:'RED RIVER RUSTLERS',abbr:'RRR',jersey:'#93283a',pants:'#efe1c4',cap:'#4f1420',
  pitcher:{name:'CALDWELL',velo:.92,ctrl:.56},
  lineup:[['CANTU','R',.3,.8,.85],['HAYES','L',.4,.78,.75],['RAMIREZ','R',.9,.62,.4],['GRISSOM','R',.85,.6,.35],
   ['BOONE','L',.65,.66,.5],['PRUITT','R',.5,.7,.55],['LANDRY','L',.35,.75,.7],['VOSS','R',.4,.6,.35],['ABEL','R',.25,.68,.75]]},
 {name:'PRAIRIE COMETS',abbr:'PRC',jersey:'#26408a',pants:'#e9e5dc',cap:'#f08a2c',
  pitcher:{name:'ASHWORTH',velo:.74,ctrl:.84},
  lineup:[['NAKAMURA','L',.25,.9,.95],['PIERCE','R',.45,.75,.7],['OSEI','R',.8,.7,.55],['LINDQVIST','L',.92,.58,.3],
   ['MORENO','R',.6,.68,.5],['CHO','L',.45,.74,.6],['BRADLEY','R',.5,.62,.45],['TRAN','R',.3,.7,.7],['DUFFY','L',.3,.66,.55]]},
 {name:'MESA SIDEWINDERS',abbr:'MSA',jersey:'#1d7e7b',pants:'#e8d3a2',cap:'#103b3a',
  pitcher:{name:'REDHORSE',velo:.86,ctrl:.66},
  lineup:[['YAZZIE','R',.35,.82,.9],['FONTAINE','L',.4,.76,.7],['ESPINOZA','R',.88,.6,.45],['MCCRAY','R',.8,.64,.4],
   ['HALVORSEN','L',.7,.6,.4],['RUIZ','R',.5,.72,.6],['KEMP','L',.4,.7,.6],['OYELARAN','R',.45,.6,.5],['SATO','R',.25,.74,.85]]},
];
const skinOf=n=>{let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))>>>0;return SKINS[h%SKINS.length];};

/* ---------------- input ---------------- */
const keys={up:0,down:0,left:0,right:0,a:0,b:0,start:0,select:0};
let pressed={};
function setKey(k,v){ if(v&&!keys[k]){pressed[k]=1; audioInit();} keys[k]=v?1:0; }
const took=k=>{ if(pressed[k]){pressed[k]=0;return true;} return false; };
const anyTook=()=>['a','b','start','up','down','left','right'].some(k=>pressed[k]);

document.querySelectorAll('[data-k]').forEach(el=>{
  const k=el.dataset.k;
  const on=e=>{e.preventDefault(); try{el.setPointerCapture(e.pointerId);}catch(_){} setKey(k,1); el.classList.add('on');};
  const off=e=>{setKey(k,0); el.classList.remove('on');};
  el.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,off));
  el.addEventListener('contextmenu',e=>e.preventDefault());
});
const dpad=document.getElementById('dpad');
function dpadAt(e){
  const r=dpad.getBoundingClientRect(),dx=(e.clientX-r.left)/r.width-.5,dy=(e.clientY-r.top)/r.height-.5,t=.13;
  const s={left:dx<-t,right:dx>t,up:dy<-t,down:dy>t};
  // keep one axis unless clearly diagonal
  if(Math.abs(dx)>Math.abs(dy)*2.2){s.up=s.down=false;} else if(Math.abs(dy)>Math.abs(dx)*2.2){s.left=s.right=false;}
  for(const k in s) setKey(k,s[k]);
  dpad.dataset.dir=(s.up?'u ':'')+(s.down?'d ':'')+(s.left?'l ':'')+(s.right?'r':'');
}
function dpadOff(){ ['up','down','left','right'].forEach(k=>setKey(k,0)); dpad.dataset.dir=''; }
dpad.addEventListener('pointerdown',e=>{e.preventDefault(); try{dpad.setPointerCapture(e.pointerId);}catch(_){} dpadAt(e);});
dpad.addEventListener('pointermove',e=>{ if(e.buttons||e.pointerType==='touch') dpadAt(e); });
['pointerup','pointercancel','lostpointercapture'].forEach(t=>dpad.addEventListener(t,dpadOff));
const KMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyW:'up',KeyS:'down',KeyA:'left',KeyD:'right',
  KeyX:'a',KeyK:'a',Space:'a',KeyZ:'b',KeyJ:'b',Enter:'start',KeyP:'start',Escape:'start',KeyM:'select'};
// keyboard vs touch decides how on-screen tips name the controls
let kbMode=matchMedia('(hover:hover) and (pointer:fine)').matches;
addEventListener('keydown',()=>{kbMode=true;},{capture:true});
addEventListener('pointerdown',e=>{ if(e.pointerType==='touch') kbMode=false; },{capture:true});
// standard-mapping gamepads (Xbox / PlayStation / Switch Pro): face buttons, d-pad or left stick, Start, Select/Back
const padHeld={}; let padToast=0;
addEventListener('gamepadconnected',()=>{ padToast=4; kbMode=false; });
function pollPad(){
  const pads=navigator.getGamepads?navigator.getGamepads():[]; let gp=null;
  for(const p of pads) if(p&&p.connected){ gp=p; break; }
  if(!gp) return;
  const bt=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed),ax=gp.axes||[];
  const st={a:bt(0)||bt(3),b:bt(1)||bt(2),start:bt(9),select:bt(8),
    up:bt(12)||ax[1]<-.55,down:bt(13)||ax[1]>.55,left:bt(14)||ax[0]<-.55,right:bt(15)||ax[0]>.55};
  for(const k in st) if(st[k]!==!!padHeld[k]){ padHeld[k]=st[k]; setKey(k,st[k]); if(st[k]) kbMode=false; }
}
addEventListener('keydown',e=>{const k=KMAP[e.code]; if(k){e.preventDefault(); if(!e.repeat) setKey(k,1);}});
addEventListener('keyup',e=>{const k=KMAP[e.code]; if(k) setKey(k,0);});
addEventListener('blur',()=>{for(const k in keys) keys[k]=0;});

/* ---------------- audio ---------------- */
let AC=null,master=null,muted=false,noiseBuf=null,keepAlive=null;
// a looping silent WAV keeps iOS in "playback" mode so the ringer switch doesn't mute the game
function silentWav(){
  const n=800,b=new Uint8Array(44+n),v=new DataView(b.buffer),w=(o,str)=>{for(let i=0;i<str.length;i++) b[o+i]=str.charCodeAt(i);};
  w(0,'RIFF'); v.setUint32(4,36+n,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,8000,true); v.setUint32(28,8000,true); v.setUint16(32,1,true); v.setUint16(34,8,true); w(36,'data'); v.setUint32(40,n,true); b.fill(128,44);
  let bin=''; for(const x of b) bin+=String.fromCharCode(x); return 'data:audio/wav;base64,'+btoa(bin);
}
function audioInit(){
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(_){}
  try{
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=.85; const hp=AC.createBiquadFilter(),lp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=37; lp.type='lowpass'; lp.frequency.value=14000; master.connect(hp).connect(lp).connect(AC.destination); }
    if(AC.state!=='running') AC.resume();
    const b=AC.createBuffer(1,1,22050),src=AC.createBufferSource(); src.buffer=b; src.connect(AC.destination); src.start(0);
  }catch(_){}
  try{ if(!keepAlive){ keepAlive=new Audio(silentWav()); keepAlive.loop=true; keepAlive.setAttribute('playsinline',''); } if(keepAlive.paused) keepAlive.play().catch(()=>{}); }catch(_){}
}
['touchend','click','keydown','pointerup'].forEach(t=>addEventListener(t,audioInit,{capture:true,passive:true}));
/* ---------- NES-style sound chip: 2 pulse channels, stepped triangle, LFSR noise, 60 Hz envelopes ---------- */
const CPU=1789773,FR=1/60,NOISE_P=[4,8,16,32,64,96,128,160,202,254,380,508,762,1016,2034,4068];
const nesF=f=>{ const p=Math.max(8,Math.round(CPU/(16*f)-1)); return CPU/(16*(p+1)); };   // snap to the chip's period table
const NOTE=n=>{ const m=/^([A-G])(#|b)?(\d)$/.exec(n),i={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0); return 440*Math.pow(2,((+m[3]+1)*12+i-69)/12); };
let WAVES=null;
function waves(){
  if(WAVES) return WAVES; WAVES={};
  for(const d of [.125,.25,.5]){ const n=48,re=new Float32Array(n),im=new Float32Array(n); for(let k=1;k<n;k++) re[k]=2*Math.sin(Math.PI*k*d)/(Math.PI*k); WAVES['p'+d]=AC.createPeriodicWave(re,im); }
  const N=1024,x=new Float32Array(N); for(let i=0;i<N;i++){ const st=Math.floor(i/N*32),v=st<16?15-st:st-16; x[i]=v/7.5-1; }   // 4-bit stair-step triangle
  const H=64,re=new Float32Array(H),im=new Float32Array(H);
  for(let k=1;k<H;k++){ let a=0,b=0; for(let i=0;i<N;i++){ const ph=2*Math.PI*k*i/N; a+=x[i]*Math.cos(ph); b+=x[i]*Math.sin(ph); } re[k]=a*2/N; im[k]=b*2/N; }
  WAVES.tri=AC.createPeriodicWave(re,im,{disableNormalization:true});
  const lfsr=short=>{ const len=short?93*40:32767,buf=AC.createBuffer(1,len,AC.sampleRate),ch=buf.getChannelData(0); let r=1;
    for(let i=0;i<len;i++){ const fb=(r&1)^((r>>(short?6:1))&1); r=(r>>1)|(fb<<14); ch[i]=(r&1)?.75:-.75; } return buf; };
  WAVES.nL=lfsr(false); WAVES.nS=lfsr(true);
  return WAVES;
}
// volume in 16 hardware steps, updated once per video frame
function env(g,t,dur,v,mode){
  const n=Math.max(1,Math.round(dur/FR));
  for(let i=0;i<=n;i++){ const u=i/n;
    const lv=mode==='hold'?(i<n?15:0):mode==='swell'?Math.round(15*Math.sin(Math.PI*u)):mode==='pluck'?(i<2?15:Math.max(0,Math.round(11*(1-u)))):Math.max(0,Math.round(15*(1-u)));
    g.gain.setValueAtTime(v*lv/15,t+i*FR); }
  g.gain.setValueAtTime(0,t+dur+FR);
}
let musicNodes=[],musicName=null,musicLoop=false,musicEnd=0;
function voice(ch,f,t,dur,{vol=.2,mode='decay',sweep=null,music=false}={}){
  if(!AC||muted) return;
  const o=AC.createOscillator(),g=AC.createGain(); o.setPeriodicWave(waves()[ch]);
  if(sweep){ const n=Math.max(1,Math.round(dur/FR)); for(let i=0;i<=n;i++) o.frequency.setValueAtTime(ch==='tri'?sweep(i/n):nesF(sweep(i/n)),t+i*FR); }
  else o.frequency.setValueAtTime(ch==='tri'?f:nesF(f),t);
  env(g,t,dur,vol,ch==='tri'?'hold':mode); o.connect(g).connect(master); o.start(t); o.stop(t+dur+.06);
  if(music) musicNodes.push({n:o,end:t+dur});
}
function nz(t,dur,{per=6,to=null,vol=.2,short=false,mode='decay',music=false}={}){
  if(!AC||muted) return;
  const s=AC.createBufferSource(),g=AC.createGain(),W=waves(),rate=p=>CPU/NOISE_P[clamp(Math.round(p),0,15)]/AC.sampleRate;
  s.buffer=short?W.nS:W.nL; s.loop=true;
  if(to!==null){ const n=Math.max(1,Math.round(dur/FR)); for(let i=0;i<=n;i++) s.playbackRate.setValueAtTime(rate(per+(to-per)*i/n),t+i*FR); }
  else s.playbackRate.setValueAtTime(rate(per),t);
  env(g,t,dur,vol,mode); s.connect(g).connect(master); s.start(t); s.stop(t+dur+.06);
  if(music) musicNodes.push({n:s,end:t+dur});
}
const now=(d=0)=>AC?AC.currentTime+d:0;

/* ---------- songs: [note, beats] per channel ---------- */
function waltzAccomp(chords){   // oom-pah-pah: triangle root on 1, pulse chord tones on 2 and 3
  const C={C:['C3','E4','G4'],G:['G2','B3','D4'],G7:['G2','B3','F4'],A7:['A2','C#4','G4'],Dm:['D3','F4','A4'],D7:['D3','F#4','C5'],F:['F2','A3','C4']};
  const bass=[],mid=[];
  for(const c of chords){ const [r,a,b]=C[c]; bass.push([r,1],['R',2]); mid.push(['R',1],[a,1],[b,1]); }
  return {bass,mid};
}
const TMOTBG=[['C5',2],['C6',1],['A5',1],['G5',1],['E5',1],['G5',3],['D5',3],
  ['C5',2],['C6',1],['A5',1],['G5',1],['E5',1],['G5',6],
  ['A5',1],['G#5',1],['A5',1],['E5',1],['F5',1],['G5',1],['A5',2],['F5',1],['D5',3],

    else out.push([ell([c[0]+face*R(.42),cy+R(.03)],R(.27),R(.075)),shade(Cp,.65)]);
    if(opt.helmet&&!front) out.push([ell([c[0]-face*R(.1),c[1]+R(.05)],R(.24),R(.28)),Cp]);
    return out; };
  const farLegFirst=front?[]:[leg(P.hipF,P.kF,P.aF,true)];
  if(opt.pre) opt.pre(T,g);
  if(!front&&!opt.leadOver){ layer(arm(P.sF,P.eF,P.hF,true,opt.glove==='F')); }
  farLegFirst.forEach(layer);

    layer(arm(P.sN,P.eN,P.hN,false,opt.glove==='N')); }

const ART_INK='#0d0b10';
function discPx(cx,cy,r,fn){ if(r<.6){ fn(Math.round(cx),Math.round(cy)); return; }
  for(let y=Math.floor(cy-r);y<=Math.ceil(cy+r);y++) for(let x=Math.floor(cx-r);x<=Math.ceil(cx+r);x++) if((x-cx)*(x-cx)+(y-cy)*(y-cy)<=r*r+.15) fn(x,y); }

    if(p.k==='rect'){ for(let y=p.y;y<p.y+p.h;y++) for(let x=p.x;x<p.x+p.w;x++) put(x,y,p.c,i); }
    else if(p.k==='disc') discPx(p.x,p.y,p.r,(x,y)=>put(x,y,p.c,i,p.maxY));
    else if(p.k==='line'){ const [a,b]=p.p,n=Math.ceil(hyp(b[0]-a[0],b[1]-a[1])*3)+1;
      for(let s=0;s<=n;s++){ const t=s/n; discPx(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,p.r0+(p.r1-p.r0)*t,(x,y)=>put(x,y,p.c,i)); } }
    else if(p.k==='poly'){ const xs=p.p.map(q=>q[0]),ys=p.p.map(q=>q[1]);
      for(let y=Math.floor(Math.min(...ys));y<=Math.ceil(Math.max(...ys));y++) for(let x=Math.floor(Math.min(...xs));x<=Math.ceil(Math.max(...xs));x++)
        if(inPoly(x+.5,y+.5,p.p)) put(x,y,(p.shadeX!==undefined&&x<p.shadeX)?p.c2:p.c,i); }

    for(const [dx,dy] of N){ const nx=x+dx,ny=y+dy; if(nx<0||ny<0||nx>=w||ny>=h) continue; const j=id[ny*w+nx]; if(j>=0&&j<i&&!parts[j].noSep) out[ny*w+nx]=ART_INK; } }

    for(const [dx,dy] of N){ const nx=x+dx,ny=y+dy; if(nx>=0&&ny>=0&&nx<w&&ny<h&&id[ny*w+nx]>=0){ out[y*w+x]=ART_INK; break; } } }
  const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d');
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const v=out[y*w+x]; if(!v) continue; g.fillStyle=v; g.fillRect(flip?w-1-x:x,y,1,1); }

  const fl=POS0.map((p,i)=>({x:p[0],y:p[1],tx:p[0],ty:p[1],spd:FSPD[i]*(humanBatting()?G.lv.fieldSpd:1),mv:false}));
  F={t:0,tr:{pts:[{x:0,y:-5,z:4}],fc:-1,hr:false,gr:false,wall:-1},fair:true,foul:false,hr:false,gr:false,la:0,bunt:false,fl,
     ball:{st:'held',f:1,x:0,y:-5,z:4},runners:[],outsPlay:0,runsPlay:0,endT:0,cool:.3+rand(0,.6),caught:false,cover:{1:2,2:4,3:5,4:1},
     catcher:1,catchT:0,catchPt:{x:0,y:-5},air:false,over:false,pops:[],steal:true,cont,relay:1};
  F.runners.push({...mkRunner(curBatter(),0,true),phantom:true});
  G.bases.forEach((info,i)=>{ if(!info) return; const r=mkRunner(info,i+1,false);
    if(st.who.includes(i+1)){ r.target=i+2; r.pos=Math.min(i+1.92,i+1.08+Math.max(0,el)*r.spd/90*.95); }
    F.runners.push(r); });
  for(const b of [2,3]){ const f=fl[F.cover[b]]; f.tx=BASE[b][0]; f.ty=BASE[b][1]; }
  G.phase='field'; camUpdate(0,true); SFX.thr();
}
function hitByPitch(){ P.steal=null; P.state='after'; P.t=0; P.hbp=true; P.msg='HIT BY PITCH'; P.msgT=1.2; P.next=G.derby?newPitch:walk; SFX.pop(); shake(.25,2.5); }
function newPitch(){
  const b=curBatter();
  P={state:'ready',t:0,wait:humanPitching()?0:rand(.9,1.6),startX:0,aimX:0,ballX:0,vx:0,ax:0,T:1,type:'',hb:handOf(b),
     swing:null,swingT:-1,resolved:false,cpuSwingAt:null,cpuOff:0,cpuBunt:false,off:humanBatting()?G.batOff:0,msg:null,msgT:0,next:null,mph:0};

function afterAB(){ G.ab[G.half]++; if(G.outs>=3) endHalf(); else if(!checkWalkoff()) startAtBat(); }
function checkWalkoff(){

}
function endHalf(){
  G.outs=0; G.balls=0; G.strikes=0; G.bases=[null,null,null]; F=null; G.phase='pitch';

  else { if(G.inning>=G.innings&&G.score[0]!==G.score[1]) return gameOver(); G.half=0; G.inning++; }

  let r=curBatter();

/* ---------------- pitching & batting ---------------- */
function moveBatter(dt){
  const v=(keys.right?1:0)-(keys.left?1:0);
  G.batOff=clamp(G.batOff+v*2.6*dt,P.hb>0?-1.1:-.5,P.hb>0?.5:1.1); P.off=G.batOff;   // inner foot stops at the box line
}
function cpuChoosePitch(){
  const pit=G.teams[1-G.half].pitcher,r=Math.random();
  P.type=r<.45?'FAST':r<.75?'CURVE':'CHANGE';
  const lv=humanBatting()?G.lv:LVL[1];
  P.aimX=gauss()*(.55+(1-pit.ctrl)*.7)*lv.aim;
  P.ax=(P.type==='CURVE'?(Math.random()<.5?-1:1)*rand(3,7):P.type==='CHANGE'?rand(-2,2):0)*lv.curve;
  P.startX=rand(-.8,.8);
  if(G.derby){ P.type=r<.6?'FAST':'CURVE'; P.aimX=gauss()*.35; P.ax=rand(-1.2,1.2); return; }
  if(Math.random()<.035) P.aimX=-handOf(curBatter())*rand(1.9,2.5);   // one gets away, inside
}
function release(){
  const pit=G.teams[1-G.half].pitcher;
  if(humanPitching()){ P.type=keys.up?'FAST':keys.down?'CHANGE':'CURVE'; P.aimX=P.startX; P.ax=0; }
  const v=pit.velo;
  P.T=(P.type==='FAST'?.86-.12*v:P.type==='CHANGE'?1.28:1.04-.06*v)*(humanBatting()?G.lv.pitchT:1);
  P.mph=Math.round(P.type==='FAST'?86+v*12:P.type==='CHANGE'?74+v*6:79+v*8);
  P.ballX=P.startX*.4;
  P.vx=(P.aimX-P.ballX-.5*P.ax*P.T*P.T)/P.T;
  P.state='flight'; P.t=0; P.rel=0; SFX.pitch();

}
function xAt(t){ const dt=Math.max(0,t-P.t); return P.ballX+P.vx*dt+.5*P.ax*dt*dt; }
function cpuDecideSwing(){
  const b=curBatter(),con=b[3];
  const truth=humanPitching()?P.ballX+P.vx*P.T:P.ballX+P.vx*P.T+.5*P.ax*P.T*P.T;
  const nz=humanPitching()?G.lv.cpuNoise:1,est=truth+gauss()*.28*nz;
  const inZone=Math.abs(est)<=.95;
  let p=inZone?.8:.2; if(G.strikes===2) p+=.12; if(G.balls===3&&G.strikes<2) p-=.25;
  if(Math.random()<p){
    P.cpuBunt=b[4]>.84&&G.outs<2&&Math.random()<.07;
    P.cpuSwingAt=P.T-.08+gauss()*.07*(1.25-con)*nz+(P.cpuBunt?-.05:0);
    P.cpuOff=clamp(est,P.hb>0?-1.1:-.5,P.hb>0?.5:1.1);
  }
}
function contact(dtc,dx,b,bunt){
  const hb=handOf(b);
  if(bunt){ if(Math.abs(dx)>1.25||Math.abs(dtc)>.2) return null; return {ev:rand(22,36),la:rand(-14,6),spray:rand(-34,34),bunt:true}; }
  const lv=humanBatting()?G.lv:LVL[1],WIN=.11*lv.win,REACH=1.0*lv.reach;
  if(Math.abs(dx)>REACH||Math.abs(dtc)>WIN) return null;
  const qx=1-Math.abs(dx)/REACH,qt=1-Math.abs(dtc)/WIN,q=.55*qx+.45*qt;
  const spray=hb*(dtc/WIN)*58+gauss()*7;
  let la=15+gauss()*(9+(1-q)*24);

  if(G.derby) la=27+gauss()*(5+(1-q)*20);   // derby swings are uppercuts: square contact gets loft
  la=clamp(la,-18,78);
  const ev=47+q*(40+24*b[2])+rand(0,7)+(G.derby?17*q:0);

function swingFeedback(dtc,dx,hit){
  const a=Math.abs(dtc),lv=G.lv,W=.11*lv.win;
  const timing=a<.028?'PERFECT':a<.06?'GOOD':dtc<0?'EARLY':'LATE';
  const where=Math.abs(dx)<.4?'':(dx*P.hb>0?'OUTSIDE':'INSIDE');
  const col=timing==='PERFECT'?'#5fd06a':timing==='GOOD'?C.yellow:'#ff8a6a';
  const text=a>W*1.6?(dtc<0?'WAY EARLY':'WAY LATE'):(where&&(!hit||Math.abs(dx)>.65)?timing+' · '+where:timing);
  G.fb={text,col,t:1.6};
}
function pitchResult(kind){
  if(humanBatting()&&P.swing&&!P.resolved&&!P.swing.bunt) swingFeedback(P.swing.t+.08-P.T,P.locX-P.off,false);
  if(G.derby){ P.state='after'; P.t=0; P.msgT=1;
    if(kind==='strike'&&P.swing) derbyOut('OUT '+(G.derby.outs+1)); else { P.msg=kind==='ball'?'BALL':'TAKE'; P.next=newPitch; SFX.ball(); }
    return; }
  P.state='after'; P.t=0; P.msgT=1;
  if(kind==='ball'){ G.balls++; SFX.ball();
    if(G.balls>=4){P.msg='BALL FOUR'; P.next=walk; P.steal=null;} else {P.msg='BALL'; P.next=newPitch;} }
  else { G.strikes++; SFX.strike();

function updatePitch(dt){

  if(P.rel!==undefined) P.rel+=dt;
  const hBat=humanBatting(),hPit=humanPitching();
  if(hBat&&!P.steal&&(P.state==='ready'||P.state==='windup'||P.state==='flight')&&took('up')) callSteal();
  if(hBat&&P.steal&&P.state!=='flight'&&took('down')){ P.steal=null; SFX.blip(); }
  if(P.state==='ready'){
    if(hBat) moveBatter(dt);
    if(hPit){
      const v=(keys.right?1:0)-(keys.left?1:0); P.startX=clamp(P.startX+v*2.4*dt,-2.3,2.3);
      if(took('a')){P.state='windup';P.t=0;}
    } else { P.wait-=dt; if(P.wait<=0){cpuChoosePitch(); P.state='windup'; P.t=0;} }
    if(P.state==='windup'&&!hBat) cpuSteal();

    if(hBat) moveBatter(dt);

  } else if(P.state==='flight'){
    P.t+=dt;

    P.vx+=P.ax*dt; P.ballX+=P.vx*dt;
    if(P.locX===undefined&&P.t>=P.T) P.locX=P.ballX;
    if(hBat){
      moveBatter(dt);
      if(!P.swing&&took('a')){P.swing={t:P.t,bunt:false}; P.swingT=0;}
      if(!P.swing&&took('b')){P.swing={t:P.t,bunt:true}; P.swingT=-1;}
    } else {
      P.off+=clamp(P.cpuOff-P.off,-3*dt,3*dt);
      if(P.cpuSwingAt!==null&&!P.swing&&P.t>=P.cpuSwingAt){P.swing={t:P.t,bunt:P.cpuBunt}; P.swingT=P.cpuBunt?-1:0;}
    }
    if(P.swing&&!P.resolved&&P.t>=P.swing.t+.08){
      P.resolved=true;
      const dtc=P.swing.t+.08-P.T,dx=xAt(P.T)-P.off;
      const c=contact(dtc,dx,curBatter(),P.swing.bunt);

      if(c){ P.tc=P.t; P.hitX=P.ballX; P.hitU=Math.min(1.05,P.t/P.T); P.state='contact'; P.t=0; P.pending=c; SFX.crack(); shake(.3,3); flashT=.1; return; }
    }
    if(!P.swing&&P.t>=P.T-.02&&Math.abs(P.ballX-(-P.hb*2.9+P.off))<.9){ hitByPitch(); return; }
    if(P.t>=P.T+.16){

  } else if(P.state==='after'){
    P.t+=dt; took('a'); took('b');
    if(P.t>1.05){ const n=P.next; P.next=null; if(P.steal&&G.bases.some(Boolean)) startStealPlay(n); else n(); }
  }
}

/* ---------------- ball in play ---------------- */
function simTraj(v,la,sp){
  let x=0,y=0,z=3,vx=v*Math.cos(la)*Math.sin(sp),vy=v*Math.cos(la)*Math.cos(sp),vz=v*Math.sin(la);
  const pts=[]; let fc=-1,hr=false,gr=false,wall=-1,after=0;
  for(let i=0;i<1100;i++){
    pts.push({x,y,z});
    if(hr&&++after>45) break;
    const s=hyp(vx,vy,vz),k=KD*s;
    vx-=k*vx*DT; vy-=k*vy*DT; vz-=(32+k*vz)*DT; x+=vx*DT; y+=vy*DT; z+=vz*DT;
    if(hr) continue;
    const r=hyp(x,y),th=Math.atan2(x,y)*180/Math.PI;
    if(y>0&&Math.abs(th)<=45){
      const fr=fenceR(th);
      if(r>=fr){
        if(z>8&&fc<0){hr=true; continue;}
        if(z>10&&fc>=0){ gr=true; pts.push({x,y,z}); break; }   // bounced over: ground-rule double
        if(fc<0) wall=i+1;
        const nx=x/r,ny=y/r,vn=vx*nx+vy*ny; if(vn>0){vx-=1.45*vn*nx; vy-=1.45*vn*ny;}
        x=nx*(fr-.5); y=ny*(fr-.5); if(fc<0) fc=i+1;
      }
    } else if(r>345||y<-45){ pts.push({x,y,z:Math.max(z,0)}); break; }
    if(z<=0){
      z=0; if(fc<0) fc=i+1;
      if(vz<-5){vz=-vz*.4; vx*=.72; vy*=.72;}
      else{ vz=0; const h=hyp(vx,vy),dec=ROLL*DT; if(h<=dec){pts.push({x,y,z}); break;} vx*=(h-dec)/h; vy*=(h-dec)/h; }
    }
  }
  return {pts,fc,hr,gr,wall};
}
function judgeFair(tr){
  const pts=tr.pts; let i=tr.fc<0?pts.length-1:tr.fc,p=pts[i];
  if(hyp(p.x,p.y)<95){ for(let j=i;j<pts.length;j++){p=pts[j]; if(hyp(p.x,p.y)>=95) break;} }
  return p.y>0&&Math.abs(Math.atan2(p.x,p.y))<=Math.PI/4+.002;
}
const throwSpd=i=>i>=6?96:i===1?108:115;
function mkRunner(info,base,isB){ return {info,pos:base,origin:base,target:base,spd:21+info[4]*7,isB,out:false,scored:false,delay:isB?.3:0}; }

function startField(c){
  P.swingT=Math.max(P.swingT,0); FX=FX.filter(f=>f.k!=='w'); F=null;
  const tr=simTraj(c.ev*1.467,c.la*Math.PI/180,c.spray*Math.PI/180);
  const fair=tr.hr||tr.gr?true:judgeFair(tr);
  const fl=POS0.map((p,i)=>({x:p[0],y:p[1],tx:p[0],ty:p[1],spd:FSPD[i]*(humanBatting()?G.lv.fieldSpd:1),mv:false}));
  F={t:0,tr,fair,foul:!fair,hr:tr.hr,gr:tr.gr,la:c.la,bunt:c.bunt,fl,ball:{st:'batted',x:0,y:0,z:3},runners:[],outsPlay:0,runsPlay:0,
     endT:0,cool:.2,caught:false,cover:{},catcher:-1,catchT:0,catchPt:null,air:false,over:false,pops:[]};
  G.phase='field'; camUpdate(0,true);
  if(!F.hr&&!F.gr){
    const pts=tr.pts,lim=F.foul?(tr.fc<0?pts.length:tr.fc):pts.length;
    let bt=1e9,bj=-1,bf=-1;
    for(let i=0;i<9;i++){ const f=fl[i],re=i===1?.4:i>=6?.55:.3;
      for(let j=0;j<lim;j++){ const t=j*DT; if(t>=bt) break; if(t<re) continue; const p=pts[j]; if(p.z>8.5) continue;
        if(hyp(p.x-f.x,p.y-f.y)-3<=f.spd*(t-re)){bt=t;bj=j;bf=i;break;} } }
    if(bf<0&&!F.foul){ const j=pts.length-1,p=pts[j],tEnd=j*DT;
      for(let i=0;i<9;i++){ const f=fl[i],t=Math.max(tEnd,.28+(hyp(p.x-f.x,p.y-f.y)-4)/f.spd); if(t<bt){bt=t;bf=i;bj=j;} } }
    if(bf>=0){ F.catcher=bf; F.catchT=bt; F.catchPt={x:pts[bj].x,y:pts[bj].y}; F.air=tr.fc<0||bj<tr.fc;
      fl[bf].tx=F.catchPt.x; fl[bf].ty=F.catchPt.y; }
  }
  const used=new Set([F.catcher]),opts={4:[1,0],1:[2,3,0],3:[5,4,0],2:[4,3,0]};
  for(const b of [4,1,3,2]) for(const i of opts[b]) if(!used.has(i)){F.cover[b]=i; used.add(i); break;}
  if(F.fair||F.air) for(const b in F.cover){ const f=fl[F.cover[b]]; f.tx=BASE[b][0]; f.ty=BASE[b][1]+(b==4?-2:0); }
  if(F.catchPt) for(let i=6;i<9;i++) if(i!==F.catcher){ const f=fl[i]; f.tx=f.x+(F.catchPt.x-f.x)*.45; f.ty=f.y+(F.catchPt.y-f.y)*.45; }
  F.runners.push(mkRunner(curBatter(),0,true));
  G.bases.forEach((r,i)=>{ if(r) F.runners.push(mkRunner(r,i+1,false)); });
  if(F.foul) return;
  if(F.hr){ F.runners.forEach(r=>{r.target=4; r.spd*=1.5; if(r.isB) r.delay=.9;}); SFX.hr(); fireworks(); return; }
  if(F.gr){ F.runners.forEach(r=>{r.target=Math.min(4,r.origin+2); if(r.isB) r.delay=.6;}); return; }
  const hold=F.air&&G.outs<2;
  F.runners.forEach(r=>{ if(r.isB||!hold) r.target=r.origin+1; });
  if(P.steal){ const el=Math.max(0,(P.tc||0)-P.steal.rel);   // hit-and-run: runners already have a head start
    F.runners.forEach(r=>{ if(!r.isB&&P.steal.who.includes(r.origin)){ r.target=r.origin+1; r.pos=Math.min(r.origin+.75,r.origin+.08+el*r.spd/90*.93); } }); }
}
function coverOf(b){ return F.cover[b]===undefined?-1:F.cover[b]; }
function live(){ return F.runners.filter(r=>!r.out&&!r.scored&&!r.phantom); }
function isForced(r){

  if(F.runners[0].out) return false;
  for(let b=1;b<r.origin;b++){ const o=F.runners.find(x=>!x.isB&&x.origin===b); if(!o||o.out) return false; }
  return true;
}
function outR(r,forced){
  if(r.out) return; r.out=true; G.outs++; F.outsPlay++; SFX.out();
  const p=runnerXY(r); F.pops.push({x:p[0],y:p[1],t:0,s:'OUT'}); puff(p[0],p[1],6);
  if(G.outs>=3){ if(forced&&F.runsPlay){ G.score[G.half]-=F.runsPlay; G.line[G.half][G.inning-1]-=F.runsPlay; F.runsPlay=0; } F.over=true; }
}
function runnerXY(r){ const b=Math.min(3,Math.floor(r.pos)),u=r.pos-b,a=BASE[b],c=BASE[b+1]; return [a[0]+(c[0]-a[0])*u,a[1]+(c[1]-a[1])*u]; }
function onCatch(){
  F.caught=true; SFX.pop(); { const c=F.fl[F.ball.f]; puff(c.x,c.y,6,'#ffffff'); }
  outR(F.runners[0],true);
  if(G.outs>=3) return;
  for(const r of live()){ if(r.pos!==r.origin) r.target=r.origin; else decideAdvance(r); }
}
function ballTimeTo(base){
  const P0=BASE[base],b=F.ball;
  if(b.st==='batted'){ if(!F.catchPt) return 99; return Math.max(0,F.catchT-F.t)+hyp(F.catchPt.x-P0[0],F.catchPt.y-P0[1])/throwSpd(F.catcher)+.35; }
  if(b.st==='held'){ const f=F.fl[b.f]; return hyp(f.x-P0[0],f.y-P0[1])/throwSpd(b.f)+.3; }
  if(b.st==='throw'){ const rem=b.dur-(F.t-b.t0),d=hyp(b.to.x-P0[0],b.to.y-P0[1]); return rem+(d<5?0:d/115+.3); }
  const f=F.fl[b.recv]; return hyp(f.x-b.x,f.y-b.y)/f.spd+hyp(b.x-P0[0],b.y-P0[1])/115+.3;
}
function decideAdvance(r){
  const b=r.pos; if(b>=4) return;

  const others=live().filter(o=>o!==r);
  if(others.some(o=>o.target===b&&o.pos<b)){ r.target=b+1; return; }   // forced along
  if(others.some(o=>o.target===b+1)) return;                             // base ahead taken
  const tr=90/r.spd,tb=ballTimeTo(b+1);

function sendRunners(){
  const rs=live().sort((a,b)=>b.pos-a.pos);
  for(const r of rs){ if(r.delay>0) continue;
    if(r.target<r.pos){ r.target=Math.ceil(r.pos); continue; }
    if(r.pos===r.target&&r.target<4){ const nb=r.target+1; if(!rs.some(o=>o!==r&&o.target===nb)) r.target=nb; } }
  SFX.blip();
}
function holdRunners(){
  const rs=live();
  for(const r of rs){ if(r.target>r.pos&&!isForced(r)){ const back=Math.floor(r.pos); if(back<1) continue;
      if(!rs.some(o=>o!==r&&o.target===back)) r.target=back; } }
  SFX.blip();
}
function throwTo(b){
  const fi=F.ball.f,f=F.fl[fi],to={x:BASE[b][0],y:BASE[b][1]},d=hyp(f.x-to.x,f.y-to.y);
  F.ball={st:'throw',from:{x:f.x,y:f.y},to,t0:F.t,dur:Math.max(.15,d/throwSpd(fi)),recv:coverOf(b),thr:fi,x:f.x,y:f.y,z:5,d};
  SFX.thr(); F.cool=.3;
}
function holderThink(){

function finishPlay(){
  const f=F; F=null;
  if(G.derby){
    const d=G.derby; G.outs=0; G.bases=[null,null,null];
    if(f.hr) d.hr++; else { d.outs++; SFX.out(); }
    const left=DERBY_OUTS-d.outs;
    banner(f.hr?'HOME RUN!':(f.foul?'FOUL':'OUT')+' '+d.outs,d.hr+' HR · '+left+(left===1?' OUT LEFT':' OUTS LEFT'),
      ()=>{ if(d.outs>=DERBY_OUTS) endDerby(); else { G.phase='pitch'; startAtBat(); } },1.2,f.hr?C.yellow:C.text);
    return;
  }
  if(f.steal){
    G.bases=[null,null,null];
    if(G.outs<3) for(const r of f.runners){ if(r.phantom||r.out||r.scored) continue; const p=Math.round(r.pos); if(p>=1&&p<=3&&!G.bases[p-1]) G.bases[p-1]=r.info; }
    const res=f.outsPlay?'CAUGHT STEALING':'STOLEN BASE!';
    banner(res,f.runsPlay?(f.runsPlay+' RUN'+(f.runsPlay>1?'S':'')+' SCORE'):'',()=>{
      if(G.outs>=3) endHalf(); else if(!checkWalkoff()){ G.phase='pitch'; f.cont(); } },1.3,f.outsPlay?C.text:C.yellow);
    return;
  }
  if(f.foul&&!f.caught){ G.phase='pitch'; if(G.strikes<2) G.strikes++; newPitch(); P.msg='FOUL BALL'; P.msgT=1; SFX.strike(); return; }
  const bat=f.runners[0];
  G.bases=[null,null,null];
  if(G.outs<3) for(const r of f.runners){ if(r.out||r.scored) continue; const p=Math.round(r.pos); if(p>=1&&p<=3&&!G.bases[p-1]) G.bases[p-1]=r.info; }
  let res,col=C.text;
  if(f.hr){res='HOME RUN!';col=C.yellow;}
  else if(f.gr){res='GROUND RULE DOUBLE';col=C.yellow;}
  else if(bat.out){
    if(f.outsPlay>=3) res='TRIPLE PLAY'; else if(f.outsPlay===2) res='DOUBLE PLAY';
    else if(f.caught) res=f.foul?'FOUL OUT':f.la>48?'POP OUT':f.la<13?'LINE OUT':'FLY OUT';
    else res='GROUND OUT';
  } else if(f.outsPlay>0) res="FIELDER'S CHOICE";
  else { res=bat.scored?'INSIDE THE PARK':['','SINGLE','DOUBLE','TRIPLE'][Math.round(bat.pos)]||'SAFE'; col=C.yellow; }
  if(!bat.out&&f.outsPlay===0) G.hits[G.half]++;
  if(!bat.out&&!f.hr){ SFX.hit(); if(G.half===1) SFX.cheer(); }
  const sub=f.runsPlay?(f.runsPlay+(f.runsPlay>1?' RUNS SCORE':' RUN SCORES')):'';
  G.ab[G.half]++;
  banner(res,sub,()=>{
    if(G.outs>=3) endHalf();
    else if(!checkWalkoff()){ G.phase='pitch'; startAtBat(); }
  },1.5,col);
}

  if(P.steal&&P.state!=='after'&&(performance.now()/180|0)%2) txt(P.steal.who.length>1?'DOUBLE STEAL!':'RUNNER GOING!',128,26,C.yellow,'center');
  if(P.msgT>0&&P.msg){ const big=P.msg.length<=7,a=Math.min(1,(1-P.msgT)/.12+.2);
    ctx.globalAlpha=Math.min(1,a); ctx.fillStyle='rgba(8,7,14,.78)'; ctx.fillRect(0,54,W,30); ctx.fillStyle=C.yellow; ctx.fillRect(0,54,W,.5); ctx.fillRect(0,83.5,W,.5);
    const ball=P.msg.startsWith('BALL');
    if(big) bigText(P.msg,128,61,16,ball?'#c9ffcf':'#fff6d0',ball?'#3fae4c':'#f4b13a'); else bigText(P.msg,128,65,8,ball?'#c9ffcf':'#fff6d0',ball?'#3fae4c':'#f4b13a');
    ctx.globalAlpha=1; }
}
function drawField(){
  const sx0=clamp(Math.round(CAM.x*RS),0,(WW-W)*RS),sy0=clamp(Math.round((CAM.y+22)*RS),0,(WH-218)*RS);
  ctx.drawImage(bgWorld,sx0,sy0,W*RS,218*RS,0,22,W,218);
  const ox=sx0/RS,oy=sy0/RS-22,S=(x,y,z=0)=>{const p=fw(x,y,z);return [p[0]-ox,p[1]-oy];};
  const def=G.teams[1-G.half],off=G.teams[G.half],ents=[];
  F.fl.forEach((f,i)=>{
    if(f.mv){ const d=f.tx-f.x; if(Math.abs(d)>.5) f.face=d<0?-1:1; }
    let fr=f.mv?'run'+'ABCD'[(F.t*12+i|0)%4]:'stand';
    if(F.ball.st==='throw'&&F.ball.thr===i&&F.t-F.ball.t0<.22) fr='throw';
    ents.push({x:f.x,y:f.y,c:spr(def,skinOf(i===0?def.pitcher.name:def.lineup[i%9][0]),fr,f.face<0,true)}); });
  live().forEach(r=>{ if(r.phantom) return; const [x,y]=runnerXY(r),mv=r.pos!==r.target&&r.delay<=0,dir=Math.sign(r.target-r.pos)||1;
    const a=BASE[Math.min(3,Math.floor(r.pos))],b=BASE[Math.min(4,Math.floor(r.pos)+1)];
    ents.push({x,y,c:spr(off,skinOf(r.info[0]),mv?(F.hr?'hr':'run')+'ABCD'[(F.t*13|0)%4]:'stand',(b[0]-a[0])*dir<0,false)}); });
  ents.sort((a,b)=>b.y-a.y).forEach(e=>{ const p=S(e.x,e.y); shadowEll(p[0],p[1],4.5,1.6); drawSpr(e.c,p[0],p[1]); });
  for(const p of FX){ if(p.k!=='w') continue; const q=S(p.x,p.y,p.z); ctx.globalAlpha=Math.max(0,.85*(1-p.t/p.life)); ctx.fillStyle=p.col; ctx.fillRect(snap(q[0]),snap(q[1]),p.sz,p.sz); }
  ctx.globalAlpha=1;
  const b=F.ball;
  if(b.x!==undefined&&!((F.hr||F.gr)&&F.t>(F.tr.pts.length-2)*DT)){
    const z=b.z||0,s=S(b.x,b.y,0),q=S(b.x,b.y,z);
    F.trail=F.trail||[]; F.trail.push([b.x,b.y,z]); if(F.trail.length>7) F.trail.shift();
    shadowEll(s[0],s[1],1.4+Math.min(2,z/40),.8);
    if(b.st!=='held') F.trail.forEach((t,i,a)=>{ const p=S(t[0],t[1],t[2]); ctx.globalAlpha=.06+.3*i/a.length; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(p[0],p[1],1,0,7); ctx.fill(); });
    ctx.globalAlpha=1; drawBallArt(q[0],q[1],1.2+Math.min(1.6,z/60),F.t*20);
  }
  F.pops.forEach(p=>{ if(p.t<0) return; const q=S(p.x,p.y); txt(p.s,q[0],q[1]-24-p.t*8,p.s==='RUN'?C.yellow:C.red,'center'); });
  if(F.foul&&!F.air&&F.t>.4) bigText('FOUL',128,40,16,'#fff6d0','#f4b13a');
  if(G.fb&&G.fb.t>0&&!F.steal){ ctx.fillStyle='rgba(8,7,14,.75)'; ctx.fillRect(0,23,W,13); txt(G.fb.text,128,26,G.fb.col,'center'); }
}
function drawBanner(){
  const b=G.banner,age=b.T-b.t,k=Math.min(1,age/.18),fade=Math.min(1,b.t/.18),hgt=b.sub?54:40,y=92;
  ctx.save(); ctx.globalAlpha=fade; ctx.translate((1-k)*-W,0);
  const gr=ctx.createLinearGradient(0,y,0,y+hgt); gr.addColorStop(0,'rgba(30,24,44,.94)'); gr.addColorStop(1,'rgba(8,7,14,.94)');
  ctx.fillStyle=gr; ctx.fillRect(0,y,W,hgt);
  ctx.fillStyle='rgba(255,255,255,.035)'; for(let i=-hgt;i<W;i+=8){ ctx.beginPath(); ctx.moveTo(i,y+hgt); ctx.lineTo(i+hgt,y); ctx.lineTo(i+hgt+3,y); ctx.lineTo(i+3,y+hgt); ctx.fill(); }
  ctx.fillStyle=C.yellow; ctx.fillRect(0,y,W,1); ctx.fillRect(0,y+hgt-1,W,1);
  const hr=b.text.startsWith('HOME RUN'),flick=hr&&((age*10|0)%2);
  const size=b.text.length>14?8:16,ty=y+(b.sub?(size===16?10:14):(size===16?12:16));
  bigText(b.text,128,ty,size,flick?'#ffffff':'#fff6d0',hr?(flick?'#e2483b':'#f4c84a'):(b.col===C.yellow?'#f4b13a':'#c8c2d4'));
  if(b.sub) txt(b.sub,128,y+36,C.dim,'center');
  ctx.restore();
}
function drawSpinBall(x,y,r,t){
  ctx.fillStyle='#130f18'; ctx.beginPath(); ctx.arc(x,y,r+1,0,7); ctx.fill();
  const gr=ctx.createRadialGradient(x-r*.35,y-r*.35,1,x,y,r); gr.addColorStop(0,'#ffffff'); gr.addColorStop(1,'#d9d2c4');
  ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.clip();
  const o=Math.sin(t*2)*r*.5; ctx.strokeStyle='#d8382c'; ctx.lineWidth=1;
  [[-1,0],[1,Math.PI]].forEach(([sg,a0])=>{ const cx=x+sg*(r*.95)+o; ctx.beginPath(); ctx.arc(cx,y,r*.72,a0-1,a0+1); ctx.stroke();
    for(let i=-3;i<=3;i++){ const a=a0+i*.28,px=cx+Math.cos(a)*r*.72,py=y+Math.sin(a)*r*.72; ctx.beginPath(); ctx.moveTo(px-Math.cos(a)*1.4,py-Math.sin(a)*1.4); ctx.lineTo(px+Math.cos(a)*1.4,py+Math.sin(a)*1.4); ctx.stroke(); } });
  ctx.restore();
}
function panel(x,y,w,h){ ctx.fillStyle='rgba(12,10,18,.9)'; ctx.fillRect(x,y,w,h); ctx.strokeStyle='#4a4158'; ctx.lineWidth=1; ctx.strokeRect(x+.5,y+.5,w-1,h-1);
  ctx.fillStyle='rgba(255,255,255,.05)'; ctx.fillRect(x+1,y+1,w-2,1); }
function drawTitle(){
  ctx.drawImage(bgPitch,0,0,W,H);
  const gr=ctx.createLinearGradient(0,0,0,H); gr.addColorStop(0,'rgba(6,5,12,.55)'); gr.addColorStop(.45,'rgba(6,5,12,.35)'); gr.addColorStop(1,'rgba(6,5,12,.85)');
  ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
  const tm=performance.now()/1000;
  bigText('DIAMOND',128,16,24,'#fffbe8','#f4c84a','#7a2a14');
  bigText("'88",150,46,16,'#ffb39f','#d8382c','#3a0d0a');
  drawSpinBall(104,54,9,tm);
  const derby=MENU.mode===1;
  const rows=[['MODE',derby?'HR DERBY':'GAME'],['LEVEL',LVL[MENU.lvl].name],['YOU',TEAMS[MENU.you]],[derby?'PITCHER':'CPU',TEAMS[MENU.cpu]],
    ['INNINGS',derby?'-':INN[MENU.inn]],['YOU BAT',derby?'-':(MENU.bat?'2ND (HOME)':'1ST (AWAY)')]];
  panel(8,94,240,98);
  rows.forEach(([k,v],i)=>{ const y=100+i*15,sel=MENU.row===i;
    if(sel){ ctx.fillStyle='rgba(244,200,74,.12)'; ctx.fillRect(10,y-3,236,14); ctx.fillStyle=C.yellow; ctx.fillRect(10,y-3,2,14); }
    txt(k,16,y,sel?C.yellow:C.dim);
    if(typeof v==='object'){ teamChip(v,89,y-.5); txt(v.name,100,y,C.text); } else txt(String(v),100,y,v==='-'?C.dim:C.text); });
  if((tm*2|0)%2) txt('PRESS START',128,198,C.text,'center');
  tiny('A FAN-MADE 8-BIT TRIBUTE',128,224,C.dim,'center');
}
function drawOver(){
  ctx.drawImage(bgPitch,0,0,W,H);
  ctx.fillStyle='rgba(6,5,12,.7)'; ctx.fillRect(0,0,W,H);
  if(G.derby){ const d=G.derby,fl=(performance.now()/250|0)%2;
    bigText('DERBY OVER',128,24,16,'#fff6d0','#f4b13a');
    panel(36,62,184,70); teamChip(G.teams[1],48,72.5); txt(G.teams[1].name,60,73,C.text);
    bigText(String(d.hr),96,90,24,'#fffbe8','#f4c84a','#7a2a14'); txt(d.hr===1?'HOME RUN':'HOME RUNS',118,98,C.text);
    txt('LEVEL '+G.lv.name,128,120,C.dim,'center');
    if(d.newBest) bigText('NEW BEST!',128,146,16,fl?'#ffffff':'#fff6d0',fl?'#e2483b':'#f4c84a');
    else txt('BEST '+d.best,128,150,C.dim,'center');
    if((performance.now()/500|0)%2) txt('PRESS START',128,196,C.text,'center');
    return; }
  bigText('FINAL',128,18,16,'#fff6d0','#f4b13a');
  const n=Math.max(G.innings,G.inning),start=Math.max(1,n-8),cols=n-start+1,x0=44,cw=12;
  panel(6,52,244,56);
  ctx.fillStyle='rgba(255,255,255,.05)'; ctx.fillRect(7,72,242,.5); ctx.fillRect(7,88,242,.5);
  for(let i=0;i<cols;i++) txt(String((start+i)%10),x0+i*cw+2,59,C.dim);
  txt('R',x0+cols*cw+8,59,C.yellow); txt('H',x0+cols*cw+26,59,C.dim);
  G.teams.forEach((t,s)=>{ const y=76+s*16; teamChip(t,10,y-.5); txt(t.abbr,20,y);
    for(let i=0;i<cols;i++){ const v=G.line[s][start+i-1]; txt(v===undefined?(s===1&&start+i===n&&G.score[1]>G.score[0]?'X':' '):String(Math.min(9,v)),x0+i*cw+2,y); }
    txt(String(G.score[s]),x0+cols*cw+8,y,C.yellow); txt(String(G.hits[s]),x0+cols*cw+26,y,C.dim); });
  const w=G.score[0]>G.score[1]?0:1; let msg=G.teams[w].name+' WIN';
  if(G.human>=0) msg=G.human===w?'YOU WIN!':'CPU WINS';
  const won=G.human===w;
  bigText(msg,128,126,msg.length>12?8:16,won?'#fffbe8':'#e8e2f0',won?'#f4c84a':'#9c95ac');
  if(won) txt(G.teams[w].name,128,150,C.dim,'center');
  if((performance.now()/500|0)%2) txt('PRESS START',128,196,C.text,'center');
}

/* ---------------- title / loop ---------------- */
function updateTitle(dt){
  titleIdle+=dt;
  if(anyTook()) titleIdle=0;
  const nRows=MENU.mode===1?4:6;   // innings / batting order don't apply to the derby
  if(MENU.row>=nRows) MENU.row=0;
  if(took('up')){MENU.row=(MENU.row+nRows-1)%nRows; SFX.blip();}
  if(took('down')){MENU.row=(MENU.row+1)%nRows; SFX.blip();}
  const ch=(took('right')?1:0)-(took('left')?1:0);
  if(ch){ SFX.blip();
    if(MENU.row===0) MENU.mode=1-MENU.mode;
    if(MENU.row===1) MENU.lvl=(MENU.lvl+ch+3)%3;
    if(MENU.row===2){ do MENU.you=(MENU.you+ch+4)%4; while(MENU.you===MENU.cpu); }
    if(MENU.row===3){ do MENU.cpu=(MENU.cpu+ch+4)%4; while(MENU.cpu===MENU.you); }
    if(MENU.row===4) MENU.inn=(MENU.inn+ch+3)%3;
    if(MENU.row===5) MENU.bat=1-MENU.bat;
  }
  if(took('start')||took('a')){ SFX.score(); newGame(MENU.you,MENU.cpu,INN[MENU.inn],MENU.bat===1,false,{lv:MENU.lvl,derby:MENU.mode===1}); return; }
  if(titleIdle>14){ titleIdle=0; const a=(Math.random()*4)|0; let b=(a+1+((Math.random()*3)|0))%4; newGame(a,b,3,true,true); }
}
function toTitle(){ stopMusic(); ST=null; mode='title'; G=null; F=null; P=null; titleIdle=0; paused=false; }
function update(dt){
  if(took('select')){ muted=!muted; const el=document.getElementById('k-select'); el.classList.toggle('lit',!muted); el.setAttribute('aria-pressed',String(!muted));
    document.getElementById('snd').textContent=muted?'SOUND OFF':'SOUND ON'; if(muted) stopMusic(); else { audioInit(); SFX.score(); } }
  if(mode==='title') updateTitle(dt);
  else if(mode==='play'){
    if(G.demo){ if(anyTook()){ toTitle(); pressed={}; return; } }
    else if(took('start')) paused=!paused;
    if(!paused){
      if(G.banner){ G.banner.t-=dt; if(G.banner.t<=0){ const b=G.banner; G.banner=null; if(b.then) b.then(); } }
      else if(G.phase==='pitch') updatePitch(dt); else if(G.phase==='streak'&&ST) updateStreak(dt); else if(F) updateField(dt);
    }
  } else if(mode==='over'){
    overT+=dt;
    if(G.demo?(overT>6||anyTook()):(overT>.8&&(took('start')||took('a')))) toTitle();
  }
  if(G&&G.fb&&!paused) G.fb.t-=dt; if(padToast>0) padToast-=dt;
  updateFX(dt); if(shakeT>0) shakeT-=dt; if(flashT>0) flashT-=dt;
  if(mode==='play'&&G&&!paused&&((G.phase==='field'&&F)||(G.phase==='streak'&&ST))) camUpdate(dt);
  musicTick(); if(mode==='title'&&!musicName&&AC&&AC.state==='running'&&!muted) playSong('title',true);
  pressed={};
}
function draw(){
  ctx.setTransform(RS,0,0,RS,0,0);
  if(shakeT>0){ const a=shakeA*shakeT/.3; ctx.translate(snap(rand(-a,a)),snap(rand(-a,a))); }
  ctx.fillStyle='#000'; ctx.fillRect(-6,-6,W+12,H+12);
  if(mode==='title') drawTitle();
  else if(mode==='over') drawOver();
  else { if(G.phase==='field'&&F) drawField(); else if(G.phase==='streak'&&ST) drawStreak(); else drawPitch(); drawHUD(); }
  drawFXScreen();
  if(mode==='play'){
    if(G.banner) drawBanner();
    if(paused){ ctx.fillStyle='rgba(8,7,14,.75)'; ctx.fillRect(0,98,W,34); bigText('PAUSED',128,107,16,'#fff6d0','#f4b13a'); }
  }
  if(flashT>0){ ctx.fillStyle='rgba(255,255,255,'+(flashT/.1*.45)+')'; ctx.fillRect(0,0,W,H); }
}
const hintEl=document.getElementById('hint'); let lastHint='';
function hint(){
  const L=kbMode?{lr:'←→',ud:'↑↓',up:'↑',dn:'↓',l:'←',r:'→',A:'X',B:'Z',S:'Enter'}:{lr:'◀▶',ud:'▲▼',up:'▲',dn:'▼',l:'◀',r:'▶',A:'A',B:'B',S:'START'};
  let h='';
  if(padToast>0) h='Controller connected. A swing/pitch · B bunt · START pause · SELECT sound';
  else if(mode==='title') h=`${L.ud} pick a row · ${L.lr} change it · ${L.S} to play`;
  else if(mode==='over') h=`${L.S} for a new game`;
  else if(G.demo) h=`Demo game. Press any ${kbMode?'key':'button'} for the menu.`;
  else if(paused) h=`Paused. ${L.S} to resume.`;
  else if(G.phase==='streak') h=`A streaker is loose! Press ${L.A} to skip.`;
  else if(G.derby&&G.phase==='pitch') h=`${L.lr} step in the box · ${L.A} swing. Any swing that isn't a homer is an out.`;
  else if(G.phase==='field') h=humanBatting()?`${L.A} send runners an extra base · ${L.B} hold them up`:'Your fielders play the ball and throw on their own';
  else if(humanBatting()) h=G.bases.some(Boolean)?`${L.lr} step in the box · ${L.A} swing · ${L.B} bunt · ${L.up} steal (${L.dn} cancel)`:`${L.lr} step in the box to line up the pitch · ${L.A} swing · ${L.B} bunt`;
  else h=P&&P.state==='flight'?`Hold ${L.l} or ${L.r} to break the pitch`:`${L.lr} aim · ${L.A} pitch (hold ${L.up} heater, ${L.dn} change-up)`;
  if(h!==lastHint){ hintEl.textContent=h; lastHint=h; }
}
let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(.1,(now-last)/1000); last=now;
  pollPad();
  while(acc>=DT){ update(DT); acc-=DT; }
  draw(); hint();
  requestAnimationFrame(frame);
}
async function boot(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  try{ await Promise.race([document.fonts.load(tinyFont(8)),new Promise(r=>setTimeout(r,2500))]); }catch(_){}
  txt('LOADING',128,112,C.dim,'center');
  await new Promise(r=>setTimeout(r,20));
  bgWorld=buildWorld(); bgPitch=buildPitchBG(); window.__ready=true;
  requestAnimationFrame(t=>{last=t;frame(t);});
}
window.__dbg={step:n=>{for(let i=0;i<n;i++) update(DT);},get G(){return G;},get mode(){return mode;},get P(){return P;},get F(){return F;},start:()=>{newGame(0,1,3,true,true);}};
boot();
