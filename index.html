<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">

<meta name="theme-color" content="#16141d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}[hidden]{display:none!important}</style>
<title>Diamond '88</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one column — the game screen in a console bezel, a context hint, then a two-handed controller deck under the thumbs. */
:root{
  --bezel:#16141d;      /* console body */
  --deck:#25222e;       /* controller plate */
  --deck-hi:#34303f;
  --ink:#ece6d6;        /* printed labels */
  --dim:#8e879d;
  --btn:#c9372c;        /* A/B */
  --btn-hi:#e8574a;
  --pad:#0f0e14;        /* d-pad plastic */
  --glass:#07070b;
  --f-display:"Press Start 2P", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
html{touch-action:manipulation}
body{margin:0;background:var(--bezel);color:var(--ink);font-family:var(--f-display);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.app{box-sizing:border-box;height:100%;max-width:560px;margin:0 auto;padding-inline:16px;padding-block:10px 14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.cab{position:relative;background:var(--glass);padding:6px;border-radius:6px;box-shadow:inset 0 0 0 2px #000, 0 0 0 3px var(--deck-hi);
  width:min(100%, calc((100dvh - 290px) * 256 / 240 + 12px));max-width:100%;box-sizing:border-box}
.cab::after{content:"";position:absolute;inset:6px;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.09) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 22px rgba(0,0,0,.5)}
#screen{display:block;width:100%;aspect-ratio:256/240;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
.keys{display:none;flex-wrap:wrap;justify-content:center;gap:8px 18px;font-size:9px;color:var(--dim);letter-spacing:.04em;max-width:100%}
.keys span{display:flex;align-items:center;gap:4px;white-space:nowrap}
kbd{font:inherit;font-size:9px;color:var(--ink);background:var(--deck);border-radius:4px;padding:3px 5px;box-shadow:inset 0 -2px 0 #0b0a10,0 0 0 1px var(--deck-hi)}
@media (hover:hover) and (pointer:fine){
  .app{max-width:960px}
  .app .deck{display:none}
  .keys{display:flex}
  .cab{width:min(100%, calc((100dvh - 150px) * 256 / 240 + 12px))}
}
.hint{margin:0;min-height:2.6em;font-size:9px;line-height:1.45;color:var(--dim);text-align:center;letter-spacing:.04em;max-width:40ch;text-wrap:balance}
.deck{width:100%;flex:1 1 auto;min-height:200px;max-height:300px;background:var(--deck);border-radius:14px 14px 28px 28px;
  box-shadow:inset 0 2px 0 var(--deck-hi), 0 4px 0 #0b0a10;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding-inline:14px;padding-block:12px;box-sizing:border-box;gap:8px}
.dpad{position:relative;width:min(40vw,148px);aspect-ratio:1;justify-self:start;touch-action:none}
.dpad i{position:absolute;background:var(--pad);border-radius:4px;box-shadow:0 3px 0 #000}
.dpad .h{left:0;right:0;top:33.3%;height:33.4%}
.dpad .v{top:0;bottom:0;left:33.3%;width:33.4%}
.dpad .dot{left:41%;top:41%;width:18%;height:18%;border-radius:50%;background:#1d1b25;box-shadow:none}
.dpad b{position:absolute;color:#3a3646;font-size:10px;font-weight:400}
.dpad b.u{top:6%;left:50%;transform:translateX(-50%)}
.dpad b.d{bottom:6%;left:50%;transform:translateX(-50%)}
.dpad b.l{left:6%;top:50%;transform:translateY(-50%)}
.dpad b.r{right:6%;top:50%;transform:translateY(-50%)}
.dpad[data-dir~="u"] .v,.dpad[data-dir~="d"] .v,.dpad[data-dir~="l"] .h,.dpad[data-dir~="r"] .h{background:#1c1a24}
.mid{display:flex;flex-direction:column;gap:12px;align-items:center}
.pill{font:inherit;font-size:7px;letter-spacing:.12em;color:var(--dim);background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;touch-action:none}
.pill span{display:block;width:44px;height:12px;border-radius:6px;background:#121018;box-shadow:inset 0 0 0 2px #0a090e}
.pill.on span{background:#2b2733}
.pill em{font-style:normal}
.pill.lit span{background:#2f7a3d;box-shadow:inset 0 0 0 2px #0a090e,0 0 8px rgba(95,208,106,.45)}
.ab{justify-self:end;display:flex;gap:14px;align-items:flex-end;transform:rotate(-14deg)}
.ab button{font:inherit;width:min(17vw,66px);aspect-ratio:1;border-radius:50%;border:0;background:var(--btn);color:#fff3ec;font-size:13px;
  box-shadow:0 4px 0 #6f1a14, inset 0 2px 0 var(--btn-hi);touch-action:none;display:grid;place-items:center}
.ab .a{margin-bottom:22px}
.ab button.on{transform:translateY(3px);box-shadow:0 1px 0 #6f1a14, inset 0 2px 0 var(--btn-hi)}
.ab button:focus-visible,.pill:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (min-height:880px){.deck{max-height:320px}}
/* team builder: an overlay on the game screen */
.tb{position:absolute;inset:6px;z-index:2;background:rgba(9,8,14,.97);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
  padding:10px 10px 0;box-sizing:border-box;font-size:8px;line-height:1.5;-webkit-user-select:text;user-select:text}
.tb[hidden]{display:none}
.tb h2{font-size:10px;color:#f4c84a;margin:0 0 8px;font-weight:400;letter-spacing:.06em}
.tb h3{font-size:7px;color:var(--dim);margin:10px 0 5px;font-weight:400;letter-spacing:.08em}
.tb p{margin:0 0 6px;color:var(--dim);font-size:7px}
.tb input{font:inherit;font-size:10px;color:var(--ink);background:#15131c;border:0;box-shadow:inset 0 0 0 1px #4a4158;border-radius:3px;
  padding:6px;min-width:0;width:100%;box-sizing:border-box;text-transform:uppercase}
.tb input:focus{outline:none;box-shadow:inset 0 0 0 1px #f4c84a}
.tb button{font:inherit;font-size:8px;color:var(--ink);background:var(--deck-hi);border:0;border-radius:3px;padding:6px 7px;
  box-shadow:0 2px 0 #0b0a10;cursor:pointer;touch-action:manipulation;white-space:nowrap}
.tb button:active{transform:translateY(1px);box-shadow:0 1px 0 #0b0a10}
.tb button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.tb .go{background:#f4c84a;color:#1a1408}
.tb .bad{background:#7a1f2b}
.tb .row{display:flex;gap:5px;align-items:center;margin-bottom:5px}
.tb .row>label{color:var(--dim);font-size:7px;flex:none}
.tb .pl{display:grid;grid-template-columns:minmax(0,1fr) 24px repeat(3,32px);gap:3px;align-items:center;margin-bottom:3px}
.tb .pl.arm{grid-template-columns:minmax(0,1fr) 24px repeat(2,32px)}
.tb .st{padding:3px 0;text-align:center;line-height:1.3}
.tb .st small{display:block;font-size:6px;color:var(--dim)}
.tb .sw{width:34px;height:24px;padding:0;box-shadow:inset 0 0 0 2px #0a090e,0 2px 0 #0b0a10}
.tb .bar{position:sticky;bottom:0;background:rgba(9,8,14,.97);padding:8px 0 10px;margin-top:8px;display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}

@media (prefers-reduced-motion:reduce){.ab button.on{transform:none}}
</style>

</head>
<body>
<main class="app">
  <div class="cab"><canvas id="screen" width="512" height="480" aria-label="Diamond '88 game screen"></canvas><div class="tb" id="tb" hidden></div></div>
  <p class="hint" id="hint" aria-live="polite"></p>
  <div class="keys" aria-label="Keyboard controls">
    <span><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</span>
    <span><kbd>X</kbd> or <kbd>Space</kbd> A: swing, pitch, run</span>
    <span><kbd>Z</kbd> B: bunt, hold</span>
    <span><kbd>Enter</kbd> start/pause</span>
    <span>Paused: <kbd>Z</kbd> quit to menu</span>
    <span><kbd>M</kbd> sound</span>
    <span>Gamepads work too</span>
  </div>
  <div class="deck">
    <div class="dpad" id="dpad" aria-label="Direction pad">
      <i class="h"></i><i class="v"></i><i class="dot"></i>
      <b class="u">▲</b><b class="d">▼</b><b class="l">◀</b><b class="r">▶</b>
    </div>
    <div class="mid">
      <button class="pill lit" data-k="select" id="k-select" aria-label="Sound on or off" aria-pressed="true"><span></span><em id="snd">SOUND ON</em></button>
      <button class="pill" data-k="start" id="k-start" aria-label="Start or pause"><span></span>START</button>
    </div>
    <div class="ab">
      <button class="b" data-k="b" id="k-b" aria-label="B button">B</button>
      <button class="a" data-k="a" id="k-a" aria-label="A button">A</button>
    </div>
  </div>
</main>

<script>
'use strict';
const W=256,H=240,DT=1/60,KD=0.0012,ROLL=30;
const cv=document.getElementById('screen'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const gauss=()=>{let u=0;for(let i=0;i<4;i++)u+=Math.random();return (u-2)/0.577;};
const hyp=Math.hypot;
const C={grass:'#3f8f3c',grass2:'#378436',dirt:'#c2834c',dirt2:'#ad713e',line:'#f3efe4',stands:'#221d2c',wall:'#1d4a37',
  yellow:'#f4c84a',hud:'#0c0b12',text:'#f3efe4',dim:'#9c95ac',red:'#e2483b',green:'#5fd06a',ball:'#ffffff',shadow:'rgba(0,0,0,.35)'};
const SKINS=['#efc29a','#d39a6a','#a96c43','#7a4a2c'];

/* ---------------- teams ---------------- */
const TEAMS=[
 {name:'NORMAN PINES',abbr:'NOR',jersey:'#2f8f4e',pants:'#f2efe4',cap:'#174d2b',
  pitcher:{name:'HOLLIS',velo:.8,ctrl:.72}, pen:[['GIBBS',.78,.7],['ACOSTA',.84,.6]], bench:[['PRYOR','R',.85,.6,.35],['SALAZAR','L',.25,.78,.95],['BECK','R',.5,.82,.5]],
  lineup:[['BRANSON','L',.3,.86,.95],['OKADA','R',.45,.8,.7],['DELACRUZ','R',.85,.66,.45],['WELLS','L',.95,.6,.4],
   ['MARSH','R',.7,.65,.5],['TATUM','R',.55,.7,.6],['IBARRA','L',.4,.72,.65],['KOWALSKI','R',.35,.62,.4],['FINCH','R',.2,.7,.8]]},
 {name:'RED RIVER RUSTLERS',abbr:'RRR',jersey:'#93283a',pants:'#efe1c4',cap:'#4f1420',
  pitcher:{name:'CALDWELL',velo:.92,ctrl:.56}, pen:[['MCBRIDE',.8,.62],['ORTEGA',.88,.5]], bench:[['DOUGLAS','L',.88,.58,.3],['FLYNN','R',.2,.76,.92],['RAMOS','R',.45,.84,.55]],
  lineup:[['CANTU','R',.3,.8,.85],['HAYES','L',.4,.78,.75],['RAMIREZ','R',.9,.62,.4],['GRISSOM','R',.85,.6,.35],
   ['BOONE','L',.65,.66,.5],['PRUITT','R',.5,.7,.55],['LANDRY','L',.35,.75,.7],['VOSS','R',.4,.6,.35],['ABEL','R',.25,.68,.75]]},
 {name:'PRAIRIE COMETS',abbr:'PRC',jersey:'#26408a',pants:'#e9e5dc',cap:'#f08a2c',
  pitcher:{name:'ASHWORTH',velo:.74,ctrl:.84}, pen:[['WHITLOCK',.72,.8],['BERG',.82,.68]], bench:[['KOVAC','R',.86,.6,.35],['IVERSON','L',.25,.8,.9],['GRANT','L',.5,.82,.5]],
  lineup:[['NAKAMURA','L',.25,.9,.95],['PIERCE','R',.45,.75,.7],['OSEI','R',.8,.7,.55],['LINDQVIST','L',.92,.58,.3],
   ['MORENO','R',.6,.68,.5],['CHO','L',.45,.74,.6],['BRADLEY','R',.5,.62,.45],['TRAN','R',.3,.7,.7],['DUFFY','L',.3,.66,.55]]},
 {name:'MESA SIDEWINDERS',abbr:'MSA',jersey:'#1d7e7b',pants:'#e8d3a2',cap:'#103b3a',
  pitcher:{name:'REDHORSE',velo:.86,ctrl:.66}, pen:[['BEGAY',.8,.66],['QUINTANA',.86,.58]], bench:[['TSOSIE','R',.9,.56,.3],['MEDINA','L',.3,.78,.92],['LOWE','R',.45,.84,.55]],
  lineup:[['YAZZIE','R',.35,.82,.9],['FONTAINE','L',.4,.76,.7],['ESPINOZA','R',.88,.6,.45],['MCCRAY','R',.8,.64,.4],
   ['HALVORSEN','L',.7,.6,.4],['RUIZ','R',.5,.72,.6],['KEMP','L',.4,.7,.6],['OYELARAN','R',.45,.6,.5],['SATO','R',.25,.74,.85]]},
];
/* ---------------- saved settings & custom teams ---------------- */
const store={get(k,d){ try{ const v=localStorage.getItem('d88.'+k); return v===null?d:JSON.parse(v); }catch(_){ return d; } },
  set(k,v){ try{ localStorage.setItem('d88.'+k,JSON.stringify(v)); }catch(_){} }};
TEAMS.forEach((t,i)=>{ t.id='b'+i; t.staff=[t.pitcher,...t.pen.map(([name,velo,ctrl])=>({name,velo,ctrl}))]; });
// custom teams are saved with 1-5 ratings; these map them onto the game's 0-1 scales
const R_POW=[0,.2,.4,.6,.8,.95],R_CON=[0,.58,.65,.72,.8,.88],R_SPD=[0,.35,.5,.65,.8,.95],R_VEL=[0,.7,.76,.82,.88,.94],R_CTL=[0,.5,.6,.7,.8,.88];
const BAT_PTS=10,ARM_PTS=7;
function fromSaved(v){
  const staff=v.staff.map(([name,a,b])=>({name,velo:R_VEL[a],ctrl:R_CTL[b]}));
  if(!v.bench) v.bench=genSaved(v.name,0).bench;
  const bat=([n,h,p,c,sp])=>[n,h,R_POW[p],R_CON[c],R_SPD[sp]];
  return {id:v.id,name:v.name,abbr:v.abbr,jersey:v.jersey,cap:v.cap,pants:v.pants,custom:true,saved:v,
    lineup:v.lineup.map(bat),bench:v.bench.map(bat),staff,pitcher:staff[0]};
}
let CUSTOM=[];
function loadTeams(){ try{ CUSTOM=store.get('teams',[]).map(fromSaved); }catch(_){ CUSTOM=[]; } }
const allTeams=()=>TEAMS.concat(CUSTOM);
loadTeams();

function rng(seed){ let a=seed>>>0; return ()=>{ a=(a+0x6D2B79F5)>>>0; let t=a; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }
function strHash(str){ let h=2166136261; for(const ch of str){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
const SURN=('ADAMS ALVAREZ ATKINS BAEZ BAKER BARNES BELL BISHOP BOWERS BRAY BRIGGS BURKE CARSON CASH CHAVEZ COLE CONLEY CROSS DALTON DAVIS DEAN '+
  'DIAZ DOYLE DRAKE DUNN EATON ELLIS EVANS FARRIS FLORES FORD FOX GAINES GARZA GENTRY GRAY GREER HALE HARPER HICKS HOLT HUFF JAMES JETER KANE KELLER '+
  'KING KNOX LAMB LANE LEON LOPEZ LUCAS MADDOX MANN MASON MAYS MILES MOSS NASH NOLAN ORTIZ OWENS PAGE PARKS PENA PRICE QUINN RAINES REED REYES RHODES '+
  'RIOS ROSS SALAS SHAW SIMS SLOAN SOTO STONE STRONG TAYLOR TODD TUCKER VANCE VEGA WADE WALSH WARD WEBB WEST WOLFE YORK YOUNG ZAMORA').split(' ');
const KITS=['#2f8f4e','#93283a','#26408a','#1d7e7b','#c2571a','#5b2a86','#2a2a36','#b8860b','#0f6f9f','#3b6b2a','#a8302a','#d89a1e','#4a4a58','#8a3b12'];
const PANTS=['#f2efe4','#efe1c4','#e9e5dc','#cfcbc4','#8e8a98'];
function cleanName(v,n){ return String(v||'').toUpperCase().replace(/[^A-Z0-9 .'&-]/g,'').replace(/\s+/g,' ').slice(0,n); }
function abbrOf(name){
  const w=cleanName(name,18).replace(/[^A-Z ]/g,'').split(' ').filter(Boolean);
  if(!w.length) return 'NEW';
  return (w.length>=3?w[0][0]+w[1][0]+w[2][0]:w[0].slice(0,3)).padEnd(3,'X');
}
// same name + salt always builds the same team, so a name is all you need
function genSaved(name,salt){
  const r=rng(strHash(name+'#'+salt)),pick=a=>a[(r()*a.length)|0],used=new Set();
  const nm=()=>{ let n; do n=pick(SURN); while(used.has(n)); used.add(n); return n; };
  const fit=(arr,max)=>{ arr=arr.map(v=>clamp(v+(r()<.3?1:0)-(r()<.3?1:0),1,5)); while(arr.reduce((a,b)=>a+b)>max){ const i=arr.indexOf(Math.max(...arr)); arr[i]--; } return arr; };
  // batting-order archetypes [power, contact, speed]: table setters, sluggers, then the bottom of the order
  const ARCH=[[1,3,5],[2,4,3],[4,3,2],[5,2,2],[4,2,2],[3,3,2],[2,3,3],[2,3,2],[1,3,4]];
  const lineup=ARCH.map(a=>[nm(),r()<.35?'L':'R',...fit(a,BAT_PTS)]);
  const bench=[[5,2,2],[1,3,5],[2,5,2]].map(a=>[nm(),r()<.35?'L':'R',...fit(a,BAT_PTS)]);   // power bat, pinch runner type, contact bat
  const staff=[fit(pick([[4,3],[3,4],[5,2]]),ARM_PTS),fit([3,3],ARM_PTS),fit(pick([[4,2],[2,4]]),ARM_PTS)].map(v=>[nm(),...v]);
  const jersey=pick(KITS),cap=r()<.6?shade(jersey,.55):pick(KITS);
  return {id:null,name,abbr:abbrOf(name),jersey,cap,pants:pick(PANTS),lineup,bench,staff};
}

// share codes: the saved team packed into one URL-safe string (D1 = format version)
function b64u(str){ const b=new TextEncoder().encode(str); let bin=''; for(const x of b) bin+=String.fromCharCode(x); return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64u(code){ const bin=atob(code.replace(/-/g,'+').replace(/_/g,'/')); return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))); }
function teamCode(v){
  const rows=a=>a.map(p=>p.join(',')).join(';');
  return 'D1'+b64u([v.name,v.abbr,v.jersey.slice(1),v.cap.slice(1),v.pants.slice(1),rows(v.lineup),rows(v.staff),rows(v.bench||[])].join('|'));
}
function teamFromCode(raw){
  try{
    const m=String(raw||'').match(/D1[A-Za-z0-9_-]+/); if(!m) return null;
    const f=unb64u(m[0].slice(2)).split('|'); if(f.length<8) return null;
    const hex=h=>/^[0-9a-f]{6}$/i.test(h)?'#'+h.toLowerCase():null,n5=v=>clamp(parseInt(v,10)||1,1,5);
    const bats=t=>t.split(';').map(r=>r.split(',')).map(([n,h,p,c,sp])=>[cleanName(n,10)||'PLAYER',h==='L'?'L':'R',n5(p),n5(c),n5(sp)]);
    const fitB=p=>{ while(p[2]+p[3]+p[4]>BAT_PTS){ const i=2+[p[2],p[3],p[4]].indexOf(Math.max(p[2],p[3],p[4])); p[i]--; } return p; };
    const name=cleanName(f[0],18)||'SHARED TEAM',lineup=bats(f[5]).map(fitB),bench=bats(f[7]).map(fitB);
    const staff=f[6].split(';').map(r=>r.split(',')).map(([n,a,b])=>{ let v=n5(a),c=n5(b); while(v+c>ARM_PTS){ if(v>=c) v--; else c--; } return [cleanName(n,10)||'PITCHER',v,c]; });
    const j=hex(f[2]),cp=hex(f[3]),pn=hex(f[4]);
    if(lineup.length!==9||staff.length!==3||bench.length!==3||!j||!cp||!pn) return null;
    return {id:null,name,abbr:(f[1].toUpperCase().replace(/[^A-Z]/g,'').slice(0,3)||abbrOf(name)).padEnd(3,'X'),jersey:j,cap:cp,pants:pn,lineup,bench,staff};
  }catch(_){ return null; }
}
function shareLink(v){ return location.origin+location.pathname+'#t='+teamCode(v); }

let SET=store.get('settings',{});
function saveSettings(){
  const L=allTeams(),id=i=>L[i]?L[i].id:null;
  store.set('settings',{mode:MENU.mode,lvl:MENU.lvl,inn:MENU.inn,bat:MENU.bat,fld:MENU.fld,you:id(MENU.you),cpu:id(MENU.cpu),muted,ini:SET.ini||''});
}
function loadSettings(){

function ballTimeTo(base){
  const P0=BASE[base],b=F.ball;
  if(b.st==='batted'){ if(!F.catchPt) return 99; return Math.max(0,F.catchT-F.t)+hyp(F.catchPt.x-P0[0],F.catchPt.y-P0[1])/throwSpd(F.catcher)+.35; }
  if(b.st==='held'){ const f=F.fl[b.f]; return hyp(f.x-P0[0],f.y-P0[1])/throwSpd(b.f)+.3; }
  if(b.st==='throw'){ const rem=b.dur-(F.t-b.t0),d=hyp(b.to.x-P0[0],b.to.y-P0[1]); return rem+(d<5?0:d/115+.3); }
  const f=F.fl[b.recv]; return hyp(f.x-b.x,f.y-b.y)/f.spd+hyp(b.x-P0[0],b.y-P0[1])/115+.3;
}
function decideAdvance(r){
  const b=r.pos; if(b>=4) return;
  if(F.air&&!F.caught&&G.outs<2) return;
  const others=live().filter(o=>o!==r);
  if(others.some(o=>o.target===b&&o.pos<b)){ r.target=b+1; return; }   // forced along
  if(others.some(o=>o.target===b+1)) return;                             // base ahead taken
  const tr=90/r.spd,tb=ballTimeTo(b+1);
  const margin=humanBatting()?.55:.25+Math.random()*.35;

function sendRunners(){
  const rs=live().sort((a,b)=>b.pos-a.pos);
  for(const r of rs){ if(r.delay>0) continue;
    if(r.target<r.pos){ r.target=Math.ceil(r.pos); continue; }
    if(r.pos===r.target&&r.target<4){ const nb=r.target+1; if(!rs.some(o=>o!==r&&o.target===nb)) r.target=nb; } }
  SFX.blip();
}
function holdRunners(){
  const rs=live();
  for(const r of rs){ if(r.target>r.pos&&!isForced(r)){ const back=Math.floor(r.pos); if(back<1) continue;
      if(!rs.some(o=>o!==r&&o.target===back)) r.target=back; } }
  SFX.blip();
}
function throwTo(b){
  const fi=F.ball.f,f=F.fl[fi],to={x:BASE[b][0],y:BASE[b][1]},d=hyp(f.x-to.x,f.y-to.y);

function holderThink(){
  const fi=F.ball.f,f=F.fl[fi]; let best=null;
  for(const r of live()){

    const b=r.target; if(b<1) continue;
    const tr=Math.abs(b-r.pos)*90/r.spd+Math.max(0,r.delay),bp=BASE[b],d=hyp(f.x-bp[0],f.y-bp[1]);

    else{
      const cv=coverOf(b),runT=d/f.spd,thT=d/throwSpd(fi)+.25;
      const cvT=cv>=0&&cv!==fi?hyp(F.fl[cv].x-bp[0],F.fl[cv].y-bp[1])/F.fl[cv].spd:99;
      const thTot=Math.max(thT,cvT);
      if((cv===fi||d<30)&&runT<thTot){tb=runT;how='run';} else {tb=thTot;how='throw';}
    }
    const m=tr-tb;

    if(best.how==='throw'&&coverOf(best.b)>=0) throwTo(best.b);

    return;

    const back=r.target<r.pos,tr=Math.abs(b-r.pos)*90/r.spd,tb=hyp(f.x-BASE[b][0],f.y-BASE[b][1])/throwSpd(fi)+.25,sc=(back?5:0)+(tr-tb);

// manual fielding: the d-pad steers the fielder going after the ball; once he has it,
// direction + A throws (▶ 1st, ▲ 2nd, ◀ 3rd, ▼ home), direction + B runs it to that base.
// Leave the controls alone for a moment and the fielders go back to playing on their own.
function padBase(){ const x=(pkeys.right?1:0)-(pkeys.left?1:0),y=(pkeys.up?1:0)-(pkeys.down?1:0);
  return x>0&&!y?1:y>0&&!x?2:x<0&&!y?3:y<0&&!x?4:0; }
function manualField(dt){

  const ci=b.st==='batted'?F.catcher:b.st==='loose'?b.recv:-1;
  if(ci>=0){ const f=F.fl[ci]; F.ctrl=ci;
    if(x||y){ F.manualOn=true; F.idle=0; const d=Math.hypot(x,y); f.tx=f.x+x/d*40; f.ty=f.y+y/d*40; }
    else if(F.manualOn){ F.idle=(F.idle||0)+dt; if(F.idle>1.5){ F.manualOn=false; if(b.st==='batted'&&F.catchPt){ f.tx=F.catchPt.x; f.ty=F.catchPt.y; } } else { f.tx=f.x; f.ty=f.y; } }
    return; }
  if(b.st!=='held'){ F.ctrl=-1; return; }
  const fi=b.f,f=F.fl[fi]; F.ctrl=fi;
  const base=padBase();
  if(ptook('a')){ F.idle=0; F.handT=0;
    if(base&&coverOf(base)>=0&&coverOf(base)!==fi&&hyp(f.x-BASE[base][0],f.y-BASE[base][1])>6) throwTo(base);
    else if(base){ f.tx=BASE[base][0]; f.ty=BASE[base][1]; }
    else holderThink();
    return; }
  if(ptook('b')&&base){ F.idle=0; F.handT=0; f.tx=BASE[base][0]; f.ty=BASE[base][1]; return; }
  if(x||y){ F.idle=0; F.handT=0; const d=Math.hypot(x,y); f.tx=f.x+x/d*30; f.ty=f.y+y/d*30; F.padMv=1; return; }
  if(F.padMv){ F.padMv=0; f.tx=f.x; f.ty=f.y; }

  if(F.handT>1.5){ F.cool-=dt; if(F.cool<=0) holderThink(); }   // nobody's touching it: auto
}
function updateField(dt){

  if(G.derby){   // derby only cares whether it left the yard; end each swing quickly
    const end=(F.tr.pts.length-1)*DT,done=F.hr?F.t>end+.3:F.foul?F.t>1.1:(F.ball.st!=='batted'||F.t>end+.3);
    if(done){ F.dEnd=(F.dEnd||0)+dt; if(F.dEnd>(F.hr?0:.45)) return finishPlay(); } }

    if(man&&F.air&&!F.caught&&F.tr.fc>=0&&j>=F.tr.fc){ F.air=false; for(const r of live()) if(!r.isB&&r.pos===r.target) decideAdvance(r); }   // dropped it: runners go
    if(man&&F.manualOn&&F.catcher>=0){ const c=F.fl[F.catcher],air=F.tr.fc<0||j<F.tr.fc;
      if(p.z<8.5&&hyp(c.x-p.x,c.y-p.y)<5&&F.t>.3){ F.ball={st:'held',f:F.catcher}; F.cool=.25; F.air=air; if(air) onCatch(); else SFX.pop(); }

function finishPlay(){

    const d=G.derby; d.takes=0; G.outs=0; G.bases=[null,null,null];
    if(f.hr){ d.hr++; if(d.two) d.two.hr[G.half]=d.hr;
      const ft=f.tr.dist||0; d.long=Math.max(d.long||0,ft); if(d.two){ d.two.long=d.two.long||[0,0]; d.two.long[G.half]=Math.max(d.two.long[G.half],ft); } }

    return;
  }

    const res=f.outsPlay?'CAUGHT STEALING':'STOLEN BASE!';
    banner(res,f.runsPlay?(f.runsPlay+' RUN'+(f.runsPlay>1?'S':'')+' SCORE'):'',()=>{
      if(G.outs>=3) endHalf(); else if(!checkWalkoff()){ G.phase='pitch'; f.cont(); } },1.3,f.outsPlay?C.text:C.yellow);
    return;
  }

// The host's device runs the whole game. The guest's device sends its button presses

const NET={host:false,guest:false,live:false,conn:null,peer:null,code:'',st:'',rtt:.1,oppTeam:null,me:0,snapT:0,sfxQ:[],lastTr:-1,err:''};
const PEERJS=['https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js','https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js'];
function loadPeer(){
  if(window.Peer) return Promise.resolve();
  return PEERJS.reduce((p,url)=>p.catch(()=>new Promise((ok,bad)=>{ const sc=document.createElement('script'); sc.src=url; sc.onload=ok; sc.onerror=bad; document.head.appendChild(sc); })),Promise.reject());
}
function peerOpts(){   // ?peer=host:port points at a self-hosted PeerJS server (used for testing)
  const m=location.search.match(/[?&]peer=([^&]+)/); if(!m) return {debug:0};
  const [host,port]=decodeURIComponent(m[1]).split(':'); return {host,port:+port||9000,path:'/',secure:location.protocol==='https:',debug:0};
}
const roomId=c=>'diamond88-'+c.toLowerCase();
function myTeamMsg(){ const t=allTeams()[MENU.you]; return t.custom?{code:teamCode(t.saved)}:{builtin:t.id}; }

function netSend(o){ try{ if(NET.conn&&NET.conn.open) NET.conn.send(o); }catch(_){} }

function hostRoom(){

function hostPeer(){
  loadPeer().then(()=>{

function joinRoom(code){

// relay: a WebSocket to the Worker's room for this code, dressed up like a PeerJS connection
function relayOpen(code,role){
  const ws=new WebSocket(API_BASE.replace(/^http/,'ws')+'/room/'+code+'?role='+role);
  const c={open:false,h:{},on(e,f){ (this.h[e]=this.h[e]||[]).push(f); return this; },emit(e,x){ (this.h[e]||[]).forEach(f=>f(x)); },
    send(o){ if(ws.readyState===1) ws.send(JSON.stringify(o)); },close(){ try{ ws.close(); }catch(_){} },destroy(){ this.close(); }};
  ws.onmessage=e=>{ let m; try{ m=JSON.parse(e.data); }catch(_){ return; }
    if(m.t==='_ok') c.emit('reg'); else if(m.t==='_peer'){ c.open=true; c.emit('open'); } else if(m.t==='_err') c.emit('fail',m.e);
    else if(m.t==='_left'){ if(c.open){ c.open=false; c.emit('close'); } } else c.emit('data',m); };
  ws.onclose=()=>{ const was=c.open; c.open=false; c.emit(was?'close':'drop'); };
  return c;
}
function hostRelay(){
  const c=NET.peer=relayOpen(NET.code,'host'); netWire(c);

function joinRelay(code){

}
function joinPeer(code){

let SEA=store.get('season',null);
const seaIdx=id=>allTeams().findIndex(t=>t.id===id);
function newSeason(){
  const L=allTeams(),me=L[MENU.you],others=L.filter(t=>t!==me&&!t.custom).concat(L.filter(t=>t!==me&&t.custom)).slice(0,3);
  const RR=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]],sched=[];
  for(let c=0;c<3;c++) RR.forEach((r,i)=>sched.push(r.map(([a,b])=>(i+c)%2?[a,b]:[b,a])));   // [away,home], alternate home field
  SEA={teams:[me.id,...others.map(t=>t.id)],lvl:MENU.lvl,inn:MENU.inn,sched,g:0,w:0,l:0,rec:[0,1,2,3].map(()=>[0,0,0,0]),bat:{},pit:{},log:[]};
  store.set('season',SEA); MENU.sea=0;
}
function poisson(l){ let k=0,p=1; const e=Math.exp(-l); do{ k++; p*=Math.random(); }while(p>e); return k-1; }
function simGame(ta,tb,inn){
  const off=t=>t.lineup.reduce((a,p)=>a+p[2]*.45+p[3]*.55,0)/9,arm=t=>(t.staff[0].velo+t.staff[0].ctrl)/2;
  const lam=(o,d)=>4.4*(INN[inn]/9)*Math.exp((off(o)-.62)*4-(arm(d)-.76)*3);
  let a=poisson(lam(ta,tb)),b=poisson(lam(tb,ta)); while(a===b){ if(Math.random()<.5) a++; else b++; }
  return [a,b];
}
function seasonNext(){ if(!SEA||SEA.g>=SEA.sched.length) return null; const m=SEA.sched[SEA.g][0]; return {away:m[0],home:m[1],youHome:m[1]===0,opp:m[0]===0?m[1]:m[0]}; }
function playSeason(){
  const n=seasonNext(),L=allTeams(); if(!n) return;
  const you=seaIdx(SEA.teams[0]),opp=seaIdx(SEA.teams[n.opp]);
  if(you<0||opp<0){ SEA=null; store.set('season',null); toTitle(); return; }   // a team in this season was deleted
  newGame(you,opp,INN[SEA.inn],n.youHome,false,{lv:SEA.lvl,season:true,manual:MENU.fld===1}); G.seaRound=SEA.g;
}
function seasonRecord(){
  if(!SEA||G.seaRound!==SEA.g) return;
  const ys=G.hum[0]?0:1,n=seasonNext(),me=G.score[ys],them=G.score[1-ys],R=SEA.rec;
  const add=(i,rs,ra)=>{ R[i][rs>ra?0:1]++; R[i][2]+=rs; R[i][3]+=ra; };
  add(0,me,them); add(n.opp,them,me); if(me>them) SEA.w++; else SEA.l++;
  SEA.log.push([n.opp,me,them]);
  const [a,b]=SEA.sched[SEA.g][1],L=allTeams(),ta=L[seaIdx(SEA.teams[a])],tb=L[seaIdx(SEA.teams[b])];
  if(ta&&tb){ const [ra,rb]=simGame(ta,tb,SEA.inn); add(a,ra,rb); add(b,rb,ra); }
  for(const l of G.box[ys].bat){ const t=SEA.bat[l.name]||(SEA.bat[l.name]={ab:0,h:0,hr:0,rbi:0,bb:0,k:0}); for(const k in t) t[k]+=l[k]; }
  for(const l of G.box[ys].pit){ const t=SEA.pit[l.name]||(SEA.pit[l.name]={outs:0,h:0,r:0,bb:0,k:0}); for(const k in t) t[k]+=l[k]; }
  SEA.g++; store.set('season',SEA);
}
function seaStand(){ return SEA.rec.map((r,i)=>({i,w:r[0],l:r[1],rs:r[2],ra:r[3]})).sort((a,b)=>(b.w-b.l)-(a.w-a.l)||(b.rs-b.ra)-(a.rs-a.ra)); }
let seaPg=0;
function toSeason(){ stopMusic(); mode='season'; G=null; F=null; P=null; paused=false; seaPg=0; }
function updateSeason(){

}

const LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
async function lbCall(path,body){
  const r=await fetch(LB_URL.replace(/\/$/,'')+path,body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{});
  if(!r.ok) throw new Error('lb '+r.status); return r.json();
}
function lbStart(){
  if(!LB_URL) return; const d=G.derby,lb=G.lb={top:null,long:[],err:false,ent:null};
  Promise.all([lbCall('/top'),lbCall('/long').catch(()=>[])]).then(([top,long])=>{ lb.top=top; lb.long=long;
    const ft=d.long||0,longOk=ft>0&&(long.length<10||ft>long[long.length-1].ft);
    if(d.hr>0&&(top.length<10||d.hr>top[top.length-1].hr||longOk)){ const ini=(SET.ini||'AAA').padEnd(3,'A'); lb.ent={ch:[...ini].map(c=>Math.max(0,LETTERS.indexOf(c))),pos:0}; }
  }).catch(()=>{ lb.err=true; });
}
function lbSubmit(){
  const lb=G.lb,n=lb.ent.ch.map(i=>LETTERS[i]).join(''); lb.ent=null; lb.sending=true; SET.ini=n; saveSettings();
  lbCall('/score',{n,hr:G.derby.hr,ft:G.derby.long||0,lvl:LVL.indexOf(G.lv)}).then(top=>{ lb.top=top; lb.sending=false; lb.mine=n; G.overPg=1; SFX.score(); return lbCall('/long').then(l=>{ lb.long=l; }); })
    .catch(()=>{ lb.sending=false; lb.err=true; });
}
function updateLbEntry(){

  if(took('up')){ e.ch[e.pos]=(e.ch[e.pos]+1)%26; SFX.blip(); } if(took('down')){ e.ch[e.pos]=(e.ch[e.pos]+25)%26; SFX.blip(); }
  if(took('left')||took('b')){ e.pos=Math.max(0,e.pos-1); SFX.blip(); } if(took('right')){ e.pos=Math.min(2,e.pos+1); SFX.blip(); }

  if(took('start')) lbSubmit();
}

});
function toTitle(){
  if(NET.host&&NET.live){ NET.live=false; netSend({t:'lobby'}); stopMusic(); G=null; F=null; P=null; paused=false; mode='lobby'; NET.st='READY'; return; } stopMusic(); ST=null; mode='title'; G=null; F=null; P=null; titleIdle=0; paused=false; }
function update(dt){
  routeInput();
  if(took('select')){ setMuted(!muted); if(!muted){ audioInit(); SFX.score(); } saveSettings(); }
  if(mode==='build'){ clearPressed(); return; }
  if(NET.guest&&NET.live){ musicTick(); clearPressed(); return; }   // the host runs the game
  if(mode==='lobby'){ updateLobby(); musicTick(); clearPressed(); return; }
  if(mode==='title') updateTitle(dt);
  else if(mode==='season'){ if(!SEA) toTitle(); else updateSeason(); }
  else if(mode==='play'){
    if(G.demo){ if(anyTook()){ toTitle(); clearPressed(); return; } }
    else if(took('start')||ptook('start')) paused=!paused;
    else if(paused&&(took('b')||ptook('b'))){ SFX.blip(); const sea=G.season; toTitle(); if(sea&&SEA) toSeason(); clearPressed(); return; }
    if(!paused){
      if(G.banner){ G.banner.t-=dt; if(G.banner.t<=0){ const b=G.banner; G.banner=null; if(b.then) b.then(); } }
      else if(G.phase==='pitch') updatePitch(dt); else if(G.phase==='streak'&&ST) updateStreak(dt); else if(F) updateField(dt);
    }
  } else if(mode==='over'){
    overT+=dt;
    if(G.derby&&G.lb&&G.lb.ent){ updateLbEntry(); }
    else {
      const ch=(took('right')?1:0)-(took('left')?1:0);
      if(ch&&!G.demo&&!G.derby){ G.overPg=(G.overPg+ch+3)%3; SFX.blip(); }
      if(ch&&G.derby&&G.lb&&G.lb.top){ G.overPg=(G.overPg+ch+3)%3; SFX.blip(); }
      if(G.demo?(overT>6||anyTook()):(overT>.8&&(took('start')||took('a')))){ if(G.season&&SEA) toSeason(); else toTitle(); }
    }
  }
  if(G&&G.fb&&!paused) G.fb.t-=dt; if(padToast>0) padToast-=dt;
  updateFX(dt); if(shakeT>0) shakeT-=dt; if(flashT>0) flashT-=dt;
  if(mode==='play'&&G&&!paused&&((G.phase==='field'&&F)||(G.phase==='streak'&&ST))) camUpdate(dt);
  musicTick(); if((mode==='title'||mode==='season')&&!musicName&&AC&&AC.state==='running'&&!muted) playSong('title',true);
  clearPressed();
}
function draw(){
  ctx.setTransform(RS,0,0,RS,0,0);
  if(shakeT>0){ const a=shakeA*shakeT/.3; ctx.translate(snap(rand(-a,a)),snap(rand(-a,a))); }
  ctx.fillStyle='#000'; ctx.fillRect(-6,-6,W+12,H+12);
  if(mode==='title'||mode==='build') drawTitle();
  else if(mode==='season') drawSeason();
  else if(mode==='lobby') drawLobby();
  else if(mode==='over') drawOver();
  else { if(G.phase==='field'&&F) drawField(); else if(G.phase==='streak'&&ST) drawStreak(); else drawPitch(); drawHUD(); }
  drawFXScreen();
  if(mode==='play'){
    if(G.banner) drawBanner();
    if(paused){ ctx.fillStyle='rgba(8,7,14,.75)'; ctx.fillRect(0,94,W,46); bigText('PAUSED',128,100,16,'#fff6d0','#f4b13a');
      txt(kbMode?'ENTER RESUME   Z QUIT':'START RESUME   B QUIT',128,124,C.text,'center'); }
  }
  if(flashT>0){ ctx.fillStyle='rgba(255,255,255,'+(flashT/.1*.45)+')'; ctx.fillRect(0,0,W,H); }
}
const hintEl=document.getElementById('hint'); let lastHint='';
function hint(){
  const L=kbMode?{lr:'←→',ud:'↑↓',up:'↑',dn:'↓',l:'←',r:'→',A:'X',B:'Z',S:'Enter'}:{lr:'◀▶',ud:'▲▼',up:'▲',dn:'▼',l:'◀',r:'▶',A:'A',B:'B',S:'START'};
  let h='';
  if(padToast>0) h='Controller connected. A swing/pitch · B bunt · START pause · SELECT sound';
  else if(mode==='build') h='Type a team name and tap GENERATE, or build it player by player.';
  else if(mode==='lobby') h=NET.host?(NET.oppTeam?`${L.S} to play · ${L.B} leave`:'Send your friend the game code · '+L.B+' to leave'):NET.guest?`Waiting for the host to start · ${L.B} leave`:`Enter the code from your friend's screen · ${L.B} back`;
  else if(mode==='season') h=`${L.A} play the next game · ${L.lr} standings and stats · ${L.B} menu`;
  else if(mode==='title'){ const yt=allTeams()[MENU.you],rk=(menuRows()[MENU.row]||[])[0];
    h=rk==='mode'?(MENU.mode===2?'2 PLAYER: online, each player on their own phone or laptop. One hosts, the other joins with the code.':MENU.mode===3?'SEASON: 9 games against 3 teams, with standings and season stats.':`${L.lr} change mode · ${L.S} to play`)
      :rk==='fld'?'MANUAL: steer the fielder with the d-pad, then direction + A to throw (▶ 1st ▲ 2nd ◀ 3rd ▼ home).'
      :rk==='you'&&!seaLocked()?(!yt?`${L.A} to build a new team`:yt.custom?`${L.lr} pick a team · ${L.B} edit this team · ${L.S} to play`:`${L.lr} pick a team · ${L.B} build a new team · ${L.S} to play`)
      :`${L.ud} pick a row · ${L.lr} change it · ${L.S} to play`; }
  else if(mode==='over') h=G.derby||G.demo?`${L.S} for a new game`:`${L.lr} box score · ${L.S} for a new game`;
  else if(G.demo) h=`Demo game. Press any ${kbMode?'key':'button'} for the menu.`;
  else if(paused) h=`Paused. ${L.S} to resume · ${G.vs&&kbMode?'F':L.B} to quit to the menu.`;
  else if(G.vs&&G.phase==='pitch'&&!G.derby&&G.pl[1-G.half]===NET.me&&!(P&&P.state==='flight')) h=`You're pitching · ${L.lr} aim · ${L.A} pitch (hold ${L.up} heater, ${L.dn} change-up) · ${L.B} bullpen`;
  else if(G.vs&&G.phase==='pitch'&&!G.derby&&G.pl[1-G.half]===NET.me) h=`Hold ${L.l} or ${L.r} to break the pitch`;
  else if(G.vs&&G.phase==='field'&&G.pl[G.half]!==NET.me&&!G.manual) h='Your fielders play the ball and throw on their own';
  else if(G.benchUI) h=`${L.ud} pick a pinch hitter · ${L.A} send him up · ${L.B} back`;
  else if(G.phase==='streak') h=`A streaker is loose! Press ${L.A} to skip.`;
  else if(G.derby&&G.derby.two&&G.pl[G.half]!==NET.me) h=`${G.teams[G.half].name} is batting. You're up after ${G.derby.max-G.derby.outs} more out${G.derby.max-G.derby.outs===1?'':'s'}.`;
  else if(G.derby&&G.phase==='pitch') h=`${L.lr} step in the box · ${L.A} swing. Any swing that isn't a homer is an out.`;
  else if(G.phase==='field'&&G.manual&&humanPitching()&&!humanBatting()) h=`Steer the fielder · direction + ${L.A} throw (${L.r} 1st ${L.up} 2nd ${L.l} 3rd ${L.dn} home) · direction + ${L.B} run it there`;
  else if(G.phase==='field') h=humanBatting()?`${L.A} send runners an extra base · ${L.B} hold them up`:'Your fielders play the ball and throw on their own';
  else if(humanBatting()&&G.balls===0&&G.strikes===0&&P&&P.state==='ready'&&G.teams[G.half].bench.length) h=`${L.lr} step in the box · ${L.A} swing · ${L.B} pinch hitter (before the first pitch)`;
  else if(humanBatting()) h=G.bases.some(Boolean)?`${L.lr} step in the box · ${L.A} swing · ${L.B} bunt · ${L.up} steal (${L.dn} cancel)`:`${L.lr} step in the box to line up the pitch · ${L.A} swing · ${L.B} bunt`;
  else if(G.pen) h=`${L.A} bring in the reliever · ${L.B} keep your pitcher`;
  else h=P&&P.state==='flight'?`Hold ${L.l} or ${L.r} to break the pitch`
    :fatigue(armNow())>=.6&&nextArm(1-G.half)?`Your pitcher is tiring. ${L.B} for the bullpen · ${L.A} pitch`
    :`${L.lr} aim · ${L.A} pitch (hold ${L.up} heater, ${L.dn} change-up) · ${L.B} bullpen`;
  if(h!==lastHint){ hintEl.textContent=h; lastHint=h; }
}
let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(.1,(now-last)/1000); last=now;
  pollPad();
  while(acc>=DT){ update(DT); acc-=DT; if(NET.host&&NET.live&&G&&(mode==='play'||mode==='over')&&(NET.snapT=(NET.snapT+1)%2)===0) netSnap(); }
  if(NET.host&&NET.conn&&now-(NET.pingAt||0)>1000){ NET.pingAt=now; netSend({t:'ping',ts:performance.now()}); }
  if(NET.conn&&NET.conn.open&&NET.seen&&now-NET.seen>6000) netLost();
  draw(); hint();
  requestAnimationFrame(frame);
}
loadSettings();
async function boot(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  try{ await Promise.race([document.fonts.load(tinyFont(8)),new Promise(r=>setTimeout(r,2500))]); }catch(_){}
  txt('LOADING',128,112,C.dim,'center');
  await new Promise(r=>setTimeout(r,20));
  bgWorld=buildWorld(); bgPitch=buildPitchBG(); window.__ready=true; probeApi();
  const sh=location.hash.match(/[#&]t=(D1[\w-]+)/);
  if(sh){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(_){}
    const v=teamFromCode(sh[1]); if(v){ openBuilder(v); TB.id=null; TB.msg='A FRIEND SHARED THIS TEAM. TAP SAVE TEAM TO KEEP IT.'; renderTB(); } }
  requestAnimationFrame(t=>{last=t;frame(t);});
}
window.__dbg={step:n=>{for(let i=0;i<n;i++) update(DT);},get G(){return G;},get mode(){return mode;},get paused(){return paused;},NET,get TB(){return TB;},openBuilder,allTeams,genSaved,get P(){return P;},get F(){return F;},start:()=>{newGame(0,1,3,true,true);}};
boot();
