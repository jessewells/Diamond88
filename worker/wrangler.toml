name = "diamond88-api"
main = "worker.js"
compatibility_date = "2026-09-01"

# serve the API under the game's own domain (the diamond88 DNS record must stay Proxied)
routes = [
  { pattern = "diamond88.wellschristmastrees.com/api/*", zone_name = "wellschristmastrees.com" }
]

# 2-player relay: one Durable Object per game code
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# derby leaderboard
[[kv_namespaces]]
binding = "LB"
id = "33e7f5eada3847cf853c5a7e8d80fa61"
